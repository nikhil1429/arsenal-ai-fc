# THE AWAY-DAY RUNNER (CYBORG_BRAIN.md §9) — a CI lane, NOT a home for the brain.
# Runs ONLY the public_safe-flagged jobs in ci_manifest.json; the runner script
# refuses the whole run if even one job lacks the flag, and refuses a flagged job
# whose command names the personal lane.
# CORRECTED 10 Aug 2026 (wire-audit): this comment used to end by claiming the
# ignore rules kept personal data out of this checkout "by construction". False
# since captain decision D10 (5 Aug, re-confirmed 10 Aug) — readiness.json,
# intake_log.json and reps_log.jsonl are TRACKED, so this checkout DOES carry his
# biometric, medication-timing and study state. His repo, his ruling; the runner
# does not reverse it. It reads the checkout live and prints what is exposed
# before any job dispatches, so this log names the open lock instead of a comment
# promising a closed one.
name: away-day
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 21 * * *"   # 03:00 IST — while the house sleeps
  workflow_dispatch: {}
jobs:
  public-safe-chores:
    # WINDOWS, not ubuntu (29 Jul 2026). This ran on ubuntu-latest and had failed
    # on EVERY push since 15 Jul — ~24 red emails — while the identical suite
    # passes on a clean Windows checkout (verified with both CRLF and LF line
    # endings). That is not a flake: the organism IS a Windows system — schtasks
    # in 10 files, 8 PowerShell installers, %APPDATA% shims, cmd.exe spawns, the
    # Windows-clipboard turnstile. Testing it on Linux tested a platform it will
    # never run on, so the red said nothing true and trained everyone to ignore CI.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node scripts/awayday.mjs run
