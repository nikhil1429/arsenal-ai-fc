# THE NEUTRAL BASELINE MACHINE (THE BLUEPRINT rung 0.4, 1 Sep 2026).
#
# WHY IT EXISTS. Every suite number this project has ever argued about was measured on ONE
# laptop, by a session that also had thirty other things running. Two numbers on record did not
# reproduce when they were finally re-run by hand. A green here is the first suite result in this
# repo's life that no session's environment, no half-finished edit and no parallel command can
# flatter — and required checks (blueprint, DAYS 4-10) can only ever be built on a machine like
# this one. Public repo, so it costs ₹0.
#
# WINDOWS, NOT UBUNTU — and that is not a preference, it is a measured ruling already on record
# in .github/workflows/awayday.yml: this suite ran on ubuntu-latest and failed on EVERY push from
# 15 Jul (~24 red emails) while the identical suite passed on a clean Windows checkout. The
# organism IS a Windows system — schtasks in ten files, eight PowerShell installers, %APPDATA%
# shims, cmd.exe spawns, the Windows-clipboard turnstile. A red from Linux said nothing true and
# trained everyone to ignore CI, which is worse than having none.
#
# THE MATRIX IS THE POINT, NOT THRIFT. The local 125-pass/4-fail baseline was measured on Node
# v24.19.0; CLAUDE.md and awayday.yml both say Node 22; package.json declares no `engines` and
# there is no .nvmrc. With ONE version, this workflow's first red would be unreadable — version
# drift, or environment? With both, the answer is in the run itself. fail-fast is off so one
# version's red can never hide the other's result. (Fixing the doc-vs-runtime discrepancy is NOT
# this workflow's job — W2-A owns the version-truth commit.)
#
# NO SECRET IS USED HERE AND NONE EVER WILL BE. The organism's first law is that every LLM lane
# rides his Max subscription and NEVER an API key — ANTHROPIC_API_KEY set means every organ
# refuses to start. So the run ASSERTS the variable is absent instead of trusting that it is:
# a law nobody checks is a law that has already been broken somewhere.
# B1 · THE NEUTRAL VERDICT (18 Nov 2026). MEASURED by the public API before this change: 0 successes in 220 runs. At
# d1002dfd the suite ran 399 s and printed 172 passed, 7 failed; from c9124edb on it died at about 87 s with no headline,
# because organism_test.mjs's writersOf() threw on the CRLF checkout this runner makes (fixed there, B1 (a)). A red on
# EVERY push says nothing about the push, so the verdict is now NEUTRAL and it is the job's exit:
#   · both trees run the HERMETIC profile (ORGANISM_TEST_PROFILE=hermetic): every member that reads live state is NAMED
#     LIVE in organism_test.mjs's table, printed with its reason, and not run here — never deleted;
#   · the HEAD tree and its MERGE BASE (the merge base with origin/main; HEAD^1 when HEAD is on main) are both measured;
#     the base by ITS OWN organism_test.mjs, or — only when that dies before its machine line — by the head's, laid over
#     a local clone of the base, with the base's own source handed to the verdict so the head's NEW asserts stay new;
#   · GREEN iff no member is red at HEAD that is not red at the base. Every red is an annotation — a NEW red an error,
#     a BASE red a warning — and the verdict is ONE more, which `node scripts/ci_verdict.mjs <sha>` reads signed-out.
# The log carries NAMES only (assert and member lines, the headline): a detail line can quote a state file, and the
# full outputs stay on the runner.
name: suite

# unit mciq · THE QUEUE BRAKE (forks row 1256 (2), 21 Nov 2026). MEASURED by the runner (two public API reads, 16:27 IST):
# 23 runs queued and 9 in progress; four ready land tips sat 16th to 20th behind runs drawn by keep refs pushed as branches
# under superseded/ and by the cloud seats' queue branches claude/<unit>-queue (one commit, a settings key, never a build).
# So a push to those two namespaces draws NO run. Syntax: `branches` with NEGATED patterns (GitHub's documented filter for
# push: patterns are read in order, the LAST one that matches a ref decides, a `!` one excludes; `branches` and
# `branches-ignore` cannot both sit on one event, and keeping the match-all "**" first leaves every other ref exactly as it
# was). It composes: the filter gates the push event alone, so pull_request and workflow_dispatch trigger as before, and an
# excluded ref never starts a run, so it never enters the concurrency group below, which is unchanged. The gate is NOT
# loosened: main, land/**, claude/*-build, claude/*-spec and every other branch still run both legs (node 22 and 24).
# Witness: ci/mciq/witness_mciq.mjs proves it by name (`*` never crosses a `/`, so claude/*-queue is one segment).
on:
  push:
    branches: ["**", "!superseded/**", "!claude/*-queue"]
  pull_request:
  workflow_dispatch: {}

# A second push while a run is in flight cancels the older one — the newest commit is the only
# one whose verdict anybody acts on.
concurrency:
  group: suite-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  npm-test:
    name: npm test · node ${{ matrix.node }}
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    env:
      ORGANISM_TEST_PROFILE: hermetic
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the merge base must be in the clone

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # THE NO-API-KEY LAW, CHECKED RATHER THAN TRUSTED.
      - name: the no-API-key law holds on this runner
        shell: bash
        run: |
          if [ -n "${ANTHROPIC_API_KEY:-}" ]; then
            echo "REFUSED — ANTHROPIC_API_KEY is set on this runner. Every organ refuses to start"
            echo "          when it is, and no lane here needs one: the organism rides the Max"
            echo "          subscription. Remove the secret from the repo, do not work around this."
            exit 1
          fi
          echo "ok — no API key on this runner, which is the only state this repo allows."

      # `npm ci` and not `npm install`: the lockfile is committed and pinned EXACT (rung S2's
      # ruling), so the runner must install what the lockfile says.
      - run: npm ci

      - name: the merge base
        id: base
        shell: bash
        run: |
          head=$(git rev-parse HEAD)
          ref="origin/main"
          if [ "${{ github.event_name }}" = "pull_request" ]; then ref="origin/${{ github.base_ref }}"; fi
          base=$(git merge-base HEAD "$ref" 2>/dev/null || true)
          if [ -z "$base" ] || [ "$base" = "$head" ]; then base=$(git rev-parse HEAD^1); fi
          echo "head=$head" >> "$GITHUB_OUTPUT"
          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head $head · merge base $base (against $ref)"

      # THE HEAD TREE. Nothing hides a red: the run's exit is printed, and the verdict step judges its output.
      - name: npm test · hermetic · head
        shell: bash
        run: |
          set +e
          node scripts/organism_test.mjs all > "$RUNNER_TEMP/b1_head.txt" 2>&1
          echo "organism_test exit $? (head)"
          grep -E "^  (ok  |FAIL|LIVE) |^organism_test:|^── " "$RUNNER_TEMP/b1_head.txt" || echo "(no headline line — the runner did not reach its own summary)"
          exit 0

      # THE MERGE BASE, measured by ITS OWN instrument first: a local clone checked out at the base (the runner's own
      # core.autocrlf applies, so it is CRLF exactly as the head is). Only when the base's own organism_test.mjs dies
      # before its machine line (as 5767e21's does on CRLF) is the HEAD's laid over it — and then the verdict is handed
      # the base's own source, so an assert the head's instrument ADDED is a new member, never an "old" red.
      - name: npm test · hermetic · merge base
        id: basetest
        shell: bash
        run: |
          set +e
          git clone -q --no-checkout . "$RUNNER_TEMP/b1_base"
          git -C "$RUNNER_TEMP/b1_base" checkout -q --detach "${{ steps.base.outputs.base }}"
          cp "$RUNNER_TEMP/b1_base/scripts/organism_test.mjs" "$RUNNER_TEMP/b1_base_instrument.mjs"
          head_instrument="$PWD/scripts/organism_test.mjs"
          cd "$RUNNER_TEMP/b1_base" && npm ci --no-audit --no-fund > "$RUNNER_TEMP/b1_base_npm.txt" 2>&1
          echo "npm ci exit $? (base)"
          node scripts/organism_test.mjs all > "$RUNNER_TEMP/b1_base.txt" 2>&1
          echo "organism_test exit $? (base, its own instrument)"
          if grep -qE '^ORGANISM_TEST_VERDICT .*"reds":' "$RUNNER_TEMP/b1_base.txt"; then
            echo "instrument=base" >> "$GITHUB_OUTPUT"
          else
            echo "the base's own instrument reached no machine line — measuring the base with the head's"
            cp "$head_instrument" scripts/organism_test.mjs
            node scripts/organism_test.mjs all > "$RUNNER_TEMP/b1_base.txt" 2>&1
            echo "organism_test exit $? (base, the head's instrument)"
            echo "instrument=head" >> "$GITHUB_OUTPUT"
          fi
          grep -E "^organism_test:" "$RUNNER_TEMP/b1_base.txt" || echo "(no headline line on the base)"
          exit 0

      # THE VERDICT — its exit IS the job's: 0 GREEN, 1 RED. Every red an annotation, then ONE verdict annotation.
      - name: the neutral verdict
        shell: bash
        run: |
          node scripts/ci_verdict.mjs compare --head "$RUNNER_TEMP/b1_head.txt" --base "$RUNNER_TEMP/b1_base.txt" \
            --label "node ${{ matrix.node }}" --head-sha "${{ steps.base.outputs.head }}" --base-sha "${{ steps.base.outputs.base }}" \
            ${{ steps.basetest.outputs.instrument == 'head' && '--base-instrument "$RUNNER_TEMP/b1_base_instrument.mjs"' || '' }} \
            | tee "$RUNNER_TEMP/b1_verdict.txt"
          code=${PIPESTATUS[0]}
          { echo "## npm test · node ${{ matrix.node }}"; echo ""; grep -E "^B1_VERDICT " "$RUNNER_TEMP/b1_verdict.txt"; } >> "$GITHUB_STEP_SUMMARY"
          exit $code

  # unit mherm · W2 · W4 · W5 (forks row 1157 (3), F2 C, 20 Nov 2026) — THE HERMETIC RUN IS A FUNCTION OF THE TREE ALONE.
  # A fresh clone of HEAD under the temp dir (os.tmpdir(), where a scratch clone sits on his laptop), the hermetic `all`
  # run twice with TMPDIR/TEMP/TMP = one fresh dir that holds the clone: W5 the two runs' verdict lines are byte-equal,
  # W2 `git status --porcelain --ignored` is the same before and after, W4 the temp dir holds nothing but the clone after.
  # The first run prints its Windows wall time. ITS OWN JOB, not a step of npm-test: that job measured 48 min of its
  # timeout-minutes on main cebe3eb (check run 136266834894), and a whole-suite double run cannot live inside the suite it
  # measures, nor inside the job that already carries it. Each run is bounded by npm-test's own timeout-minutes, read
  # from this file. W1 and W3 ride the suite itself (organism_test.mjs, hermetic mode).
  hermetic-twice:
    name: hermetic twice · node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: a fresh clone under the temp dir, the hermetic run twice (W2 · W4 · W5)
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/mherm_step.mjs" <<'MHERM_EOF'
          // unit mherm · W2 · W4 · W5 — a fresh clone under the temp dir, the hermetic `all` run twice (forks row 1157 (3), F2 C)
          import { spawnSync } from "node:child_process";
          import { mkdtempSync, readdirSync, readFileSync, symlinkSync, unlinkSync, rmSync, openSync, closeSync, existsSync } from "node:fs";
          import { join } from "node:path";
          import { tmpdir } from "node:os";
          const WS = process.cwd();
          // each run's bound is the npm-test job's own timeout-minutes (its one owner), never a number typed here
          const min = Number((/timeout-minutes:\s*(\d+)/.exec(readFileSync(join(WS, ".github", "workflows", "suite.yml"), "utf8")) || [])[1]);
          if (!(min > 0)) { console.log("RED MHERM-STEP · BOUND (no timeout-minutes in suite.yml)"); process.exit(1); }
          const git = (args, cwd) => spawnSync("git", args, { cwd, encoding: "utf8", windowsHide: true });
          const X = mkdtempSync(join(tmpdir(), "mherm-step-"));          // the run's temp dir: TMPDIR/TEMP/TMP of both runs
          const LOGS = mkdtempSync(join(process.env.RUNNER_TEMP || tmpdir(), "mherm-logs-"));
          const tree = join(X, "tree");
          const head = git(["rev-parse", "HEAD"], WS).stdout.trim();
          git(["-c", "core.autocrlf=false", "clone", "-q", "--no-local", "-c", "core.autocrlf=false", WS, tree], WS);
          git(["checkout", "-q", "--detach", head], tree);
          if (existsSync(join(WS, "node_modules"))) symlinkSync(join(WS, "node_modules"), join(tree, "node_modules"), process.platform === "win32" ? "junction" : "dir");
          const VL = /^ {2}(ok {2}|FAIL|LIVE) |^organism_test:/;
          const lines = (s) => s.split(/\r?\n/).filter((l) => VL.test(l));
          const status = () => git(["status", "--porcelain", "--ignored"], tree).stdout;
          const st0 = status();
          const env = { ...process.env, ORGANISM_TEST_PROFILE: "hermetic", TMPDIR: X, TEMP: X, TMP: X };
          const runs = [];
          for (const i of [1, 2]) {
            const log = join(LOGS, `run${i}.txt`), fd = openSync(log, "w"), t0 = Date.now();
            let r;
            try { r = spawnSync(process.execPath, [join("scripts", "organism_test.mjs"), "all"], { cwd: tree, env, stdio: ["ignore", fd, fd], timeout: min * 60000, windowsHide: true }); }
            finally { closeSync(fd); }
            const out = readFileSync(log, "utf8"), vl = lines(out);
            runs.push(vl);
            console.log(`MHERM_STEP run ${i} · wall ${((Date.now() - t0) / 1000).toFixed(1)} s · ${process.platform} · node ${process.version} · exit ${r.status}${r.error ? ` (${r.error.code || r.error.message})` : ""} · ${vl.filter((l) => l.startsWith("organism_test:")).pop() || "(no headline)"}`);
          }
          const reds = [];
          const say = (id, ok, what, why) => { console.log(`  ${ok ? "ok  " : "FAIL"} MHERM ${id} · ${what}${ok ? "" : `\n         ${why}`}`); if (!ok) reds.push(id); };
          const [a, b] = runs, at = a.findIndex((l, k) => l !== b[k]);
          say("W5", a.length > 0 && a.length === b.length && at < 0, "a fresh clone and its second run give byte-equal verdict lines",
            `run 1 ${a.length} line(s), run 2 ${b.length}; first difference at line ${at < 0 ? Math.min(a.length, b.length) + 1 : at + 1}: ${JSON.stringify(String((at < 0 ? b[a.length] ?? a[b.length] : b[at]) ?? "").slice(0, 160))}`);
          const st1 = status();
          say("W2", st1 === st0, "the two runs leave the tree as they found it (git status --porcelain --ignored, before = after)",
            `after: ${st1.split(/\r?\n/).filter((l) => l && !st0.split(/\r?\n/).includes(l)).join(" · ") || "(a line went missing)"}`);
          const left = readdirSync(X).filter((n) => n !== "tree");
          say("W4", left.length === 0, "nothing the runs write outlives them in their temp dir", `left: ${left.slice(0, 12).join(" · ")}${left.length > 12 ? ` (+${left.length - 12})` : ""}`);
          try { unlinkSync(join(tree, "node_modules")); } catch { /* no link */ }
          rmSync(X, { recursive: true, force: true });
          console.log(reds.length ? `RED MHERM-STEP · ${reds.join(" ")}` : "GREEN MHERM-STEP W2 W4 W5 · 3 clause(s)");
          process.exit(reds.length ? 1 : 0);
          MHERM_EOF
          node "$RUNNER_TEMP/mherm_step.mjs"
