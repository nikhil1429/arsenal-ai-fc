 each pass only computes the newest token; turning it off makes generation quadratic.","Streaming only improves perceived latency - total time is still time-to-first-token plus inter-token gaps - and the KV cache lives on the provider's GPU, not the user's machine."],"bolo":"Inference matlab trained model ka actual chalna - ek baar mein ek token, loop mein. Har step pe model neural network se har vocab-word ka logit (raw score) banata, phir softmax (e^score / sab e^scores ka sum) se usko % ka menu/scoreboard banata (~1 lakh words pe). Phir sampling: temperature menu ko sharp ya flat karta (kam temp = sharp, garbage% neeche; zyada temp = flat, garbage% upar; formula e^(score/T) softmax ke andar), top-k/top-p menu ko trim karta (top-k = fixed count, top-p = adaptive cumulative cutoff jo context se badalta), aur fir pick - greedy (T=0, hamesha #1, deterministic) ya weighted-random. Menu BANANA training-baked weights ka kaam; menu se UTHANA (sampling) developer ke knobs. Training se alag - training = seekhna, inference = chalna. FinOps extraction mein temp=0 (same invoice = same JSON, auditable) - par temp=0 = CONSISTENCY, accuracy nahi (galat logit ko consistently repeat karega); accuracy Pydantic + business-maths + human se. Cost: prefill (input, parallel, sasta) vs decode (output, sequential, mehnga - har output token = poora model ka ek sequential pass, jitne output words utne passes; NOT KV-cache-size). KV cache = notebook of K/V notes (input+output), badalta nahi -> reuse -> har pass sirf newest token (purane KV read) -> pass halka, par passes still sequential. Streaming = sirf PERCEIVED latency (total = TTFT + output x inter-token gap), actual same, pure UX. Lamba context mehnga - driver = SIZE (bada cache GPU VRAM + har step zyada compute). KV cache company ke GPU pe, user ke RAM mein nahi. AI proposes, code validates, human approves.","bolo_by":"- Nikhil, Jirah-tested 9/9 (FRESH - Re-Jirah day-3 = 27 Jun pending)","viz":"","deep":"### HOOK (business cliffhanger — definition nahi)\nTera FinOps tool ek `Aristo Eco — ₹81,500` wala invoice padh raha hai, aur AI use JSON mein nikaal raha hai. Har token jo AI **banata** hai, uska **paisa** lagta hai (output input se 3-5x mehnga). Par yahan asli baat: har step pe model ke saamne **ek jawab nahi hota** — use poori vocab (~1 lakh words) pe ek **probability ka menu** dikhता hai, aur use usme se **ek uthana** hota. Yeh \"ek uthana\" kaise hota — deterministic ya creative — yahi decide karta ki tera extraction **auditable** rahega ya **buggy**, aur tera API bill **kitna** aayega. Yahin inference + sampling ka poora khel hai.\n\n### MECHANISM (ek saans mein)\nTrained model **ek token at a time, loop mein** chalta. Har step: neural network → **logits** (raw scores) → **softmax** → **%** ka menu → **temperature** menu ko sharp/flat karta → **top-k/top-p** menu trim karta → **pick** (greedy ya weighted-random) → token **append** → wapas loop. **Menu banana = model (training-baked weights); menu se uthana = developer ke knobs.** Extraction pe temp=0 (consistency); cost output + context-length pe (sequential passes + KV cache size).\n\n### THE ONE PICTURE (yeh diagram poore concept ki reed hai)\n```\n\"...Invoice from Aristo\"   (ab tak ka context)\n   │\n   ▼  neural network → LOGITS (raw scores, ~1 lakh vocab)\n   │     Eco: 3.0   Pharma: 1.6   Ltd: 1.1   ...garbage: -4\n   ▼  SOFTMAX → % ka MENU / scoreboard (sum = 100%)\n   │     Eco 71%   Pharma 18%   Ltd 11%   ...\n   ▼  TEMPERATURE → menu sharp/flat            ← dev knob\n   │     T=0.5 → Eco 92% (sharp)   T=2 → Eco 54% (flat)   T=0 → Eco 100% (greedy)\n   ▼  TOP-K / TOP-P → menu trim                 ← dev knob (k=fixed count, p=adaptive %)\n   │     bachi hui choices\n   ▼  PICK (sampling) → ek token               ← T=0 greedy | T>0 weighted-random\n   │     \"Eco\"\n   ▼  APPEND → token sequence ke aage           ← phir agle token ke liye loop\n   └─────────────────────────────────┘\n```\n**MENU banana = training-baked weights | MENU se uthana = sampling (dev knobs).**\nCOST: prefill (input, **parallel**, sasta) vs decode (output, **sequential** — har token = poora model ka ek pass, **isliye 3-5x mehnga**). KV cache = notebook (input+output K/V, badalta nahi) → har pass sirf **newest token** compute → decode **sasta**, par passes **still sequential**. Streaming = sirf **dikhane** ka (TTFT + output×gap), speed same. Lamba context mehnga — driver = **SIZE** (bada cache = VRAM + har step zyada read). KV cache = **company GPU**, user RAM nahi. [K/V exactly kaise bante = concept #4, Neural Net.]"},{"id":"tokenization","num":"01","lockedOn":"2026-06-15","reJirahDone":["2026-06-18","2026-06-29"],"stream":"foundations","title":"Tokenization","status":"tempered","dot":"magenta","source":"Karpathy - Deep Dive into LLMs + Jirah session (fresh god-tier restart)","why":"Har LLM ka pehla step - text se numbers ka bridge. Interview mein guaranteed (subword kyun, strawberry-R, numbers-blind, token=cost). FinOps mein 'AI kahan NAHI lagani' (TDS code-math) decision ka foundation = senior differentiator.","hook":"Rs81,500 ka invoice AI ke saamne - par AI ko 'Rs81,500' dikhta hi nahi. Use teen alag tukde dikhte: 81 . , . 500. Yahin se har LLM ki kahani shuru hoti hai - aur yahin tera Rs81 crore wala FinOps decision chhupa hai.","mechanism":"AI sirf numbers samajhta, language nahi. Tokenization = text ko vocab ke tukdon (tokens) mein todna + har ka ID number. Vocab EK baar BPE se banti (sabse frequent adjacent letter-pairs glue, frozen). Har prompt pe woh frozen vocab longest-match se lagti - koi naya token nahi banta, existing PICK hote. IDs aage embedding stage ko jaate.","faultLines":[{"axis":"a","title":"Kya hai + analogy","strike":"Token kya hai exactly? Aur tokenization ka kaam KAHAN khatam hota hai?","weld":"Token = ek fixed catalog (vocab, ~1 lakh entries) ka text-tukda - letter, subword, ya pura common word. Har token ka ek fixed ID number. Tokenization = text ko un tukdon mein todna + har tukde ka ID nikaalna. Kaam ID-list pe KHATAM (e.g. [4,5]). Un IDs ko meaning-vector dena = embedding (alag, agla stage). Analogy: tokenizer = dictionary jo text ko known shabd-tukdon mein todta aur har ka 'page number' (ID) deta.","status":"held","deep":"**SAWAL:** *\"Token exactly kya hai — word, letter, ya kuch aur? Aur tokenization karta kya hai?\"*\n\n**POORA JAWAB:**\n- **Token = na poora word, na ek letter — beech ka \"subword\" unit.** Ek **fixed catalog piece** with a\n  numeric ID. (Catalog = vocab, ~1 lakh tokens.)\n- **Tokenization = text ko in catalog-tukdon mein todna + har ko ID dena.** Output = **IDs ki list.**\n- **Analogy (kirana/catalog):** vocab = ek fixed dictionary/catalog. Har baar tu apni line ke tukde **usi\n  catalog se** nikaalta hai — naya kuch nahi banata.\n- **Common vs rare:** common word (\"the\") = apna **pura** token (high frequency). Rare (\"Aristo\") = chhote\n  known sub-chunks (\"Ar\"+\"isto\").\n- **\"Blinkit = blink + it = 2 tokens\"** (tera apna example — sahi intuition).\n\n**INTERVIEW LINE:** *\"A token is a subword unit from a fixed vocabulary — not a word, not a character — and\ntokenization breaks text into these pieces and maps each to a numeric ID.\"*"},{"axis":"b","title":"Why subword / against word & char (first-principles)","strike":"Word-level simple hai (har word = 1 number). Subword-BPE ki jhanjhat kyun? Aur tokenization POORA skip kyun nahi kar sakte?","weld":"Subword = optimal middle path. WORD-level FAIL: vocab phatt-ta (laakhon words + har naya/typo = naya token) + OOV (unseen word pe model atakta - 'Mohan' token hai par 'Mohana' nahi milta; 'Aristo' vs 'Aristo Eco'). CHAR-level FAIL: sequence bahut lamba (har akshar = token -> slow + mehnga) + meaning bikhar jaati (akela 'E' ka matlab nahi). SUBWORD WIN: common word = 1 bada token (short seq + meaning paas), rare word = chunks (Eti.bahn - OOV solved, vocab kaabu mein). SKIP nahi kar sakte: AI math/numbers pe chalta -> text ko number banana PADEGA -> tokenization woh unavoidable, foundational bridge hai.","status":"held","deep":"**SAWAL:** *\"Character-level ya word-level kyun nahi? Subword hi kyun? Reinvent kar — agar tujhe scratch se\nbanana ho, kahan pahunchega?\"*\n\n**POORA JAWAB:**\n- **Character-level:** vocab chhota (sab letters), PAR **sequence bahut lambi** → model ko meaning pakadna\n  **mehnga** (O(n²) attention), \"bewakoof.\" → fail.\n- **Word-level:** **vocab explode** (har naya/typo word = naya token) → **OOV problem** (out-of-vocabulary —\n  naya word aaye to model phans jaata). → fail.\n- **Subword (winner):** common = bade tokens (short sequence), rare = chhote sub-words (no OOV). **Dono ka\n  best.** Isliye har bada LLM yahi use karta.\n- **Reinvent:** chahiye fixed vocab (no OOV) + reasonable length (cost control). Subword exactly yeh deta.\n\n**INTERVIEW LINE:** *\"Character-level gives short vocab but very long sequences; word-level gives short\nsequences but explodes the vocab and breaks on unknown words. Subword is the middle — fixed vocab, no OOV,\nreasonable length — which is why every major LLM uses it.\"*"},{"axis":"c","title":"Mechanism - two phase (factory builds / you use)","strike":"Factory frozen vocab banati, phir lookup. Toh naya word jaise 'COVID' (training ke baad aaya, vocab mein tha hi nahi) - model crash karega?","weld":"DO PHASE, alag moments. PHASE A (FACTORY / BUILD): training se PEHLE, SIRF EK BAAR. BPE - corpus (web-scrape + books + code, cleaned) ke words ko letters mein todo, sabse frequent adjacent PAIR glue karo -> naya token, ~50k baar repeat. Rule = pair frequency. Output = frozen vocab. PHASE B (TU / AI / USE): har prompt pe, HAR baar. Frozen vocab mein LONGEST-match lookup (sabse bada known tukda pehle, char-by-char nahi), koi counting/merging nahi, kuch banata nahi - existing token PICK karke ID deta. Naya word CRASH nahi karta: base letters HAMESHA vocab mein -> worst-case single letters. 'COVID' -> co.vid. OOV = 'zyada tukdon mein break', 'fail' nahi. Koi bhi text hamesha tokenize ho jaata.","status":"held","deep":"**SAWAL:** *\"BPE kaise kaam karta? Training vs runtime mein kya farak? 'Freeze' ko prove kar.\"*\n\n**POORA JAWAB — two phase:**\n\n**🏭 PHASE A — TRAINING (factory, ek baar):** bade **corpus** pe — base vocab (characters/bytes) se shuru →\nsaare **adjacent pairs ki frequency** count → sabse frequent pair **merge** karke naya token + **merge-rule\nsave** → repeat jab tak vocab size (~50k-100k). **Frequency hi ek rule hai.** Phir merge-rules **FREEZE**\n(frozen rulebook).\n\n**🧑 PHASE B — RUNTIME (har prompt):** koi nayi ginti **NAHI.** Naye text ko base symbols mein todo → learned\nmerge-rules **SAME order mein greedily** apply (sabse bada known chunk pehle). **Deterministic.**\n\n**HAND-TRACE (tu ne khud kiya — `ate/eat/ate`):**\n```\nRound 1: pairs count → \"at\" ×3 (sabse frequent) → MERGE \"at\"\nRound 2: \"ate\" ×2 → MERGE \"ate\"\nRound 3: \"eat\" ×1 → MERGE \"eat\"\n```\nTu ne yeh **khud trace kiya** (June 6) — yahi mechanism ka proof.\n\n**\"est\" two-merge point:** ek merge sirf **ek pair** jodta. \"est\" = pehle `e+s→\"es\"`, phir `es+t→\"est\"` —\n**do sequential merges.** Ek baar mein sirf do pieces.\n\n**NAAM (mechanism):** **\"BPE ek formula NAHI — frozen LOOKUP.\"** Train = counting; apply = table.\n\n**\"Freeze\" proof:** naya word \"Zomatoization\" — runtime **frequency nahi ginta** → frozen rulebook se greedy\nlongest-match: \"Zomato\" (agar seekha) + \"ization\" (frequent suffix), warna \"Zom\"+\"ato\"+\"iz\"+\"ation.\"\n\n**INTERVIEW LINE:** *\"BPE training counts the most frequent adjacent pairs and merges them into rules, once,\nthen freezes. At runtime there's no counting — the frozen rules apply greedily, largest known chunk first.\nIt's a lookup, not a formula.\"*"},{"axis":"d","title":"Math + value range + high/low matlab","strike":"Hero line 'Aristo Eco - Rs81,500' kitne tokens? Vocab size kitni? Token count kaise estimate?","weld":"VOCAB SIZE range: ~50k (GPT-2) -> ~100k (GPT-4 class, '1 lakh') -> ~200k (GPT-4o). 1 token ~= ~4 CHARACTERS ~= ~0.75 WORD (~100 tokens ~= 75 words). TOKEN COUNT estimate ~= characters DIVIDED BY 4 (divide, NOT modulo %). 'Aristo Eco - Rs81,500' (~20 chars) ~= 5 by rule, but ~7-8 actual (Rs + comma-number inflate karte). HIGH/LOW: token count ZYADA = zyada $ + context jaldi bharta (bura); KAM = sasta + zyada fits (achha). Efficient tokenizer (kam tokens, same text) = sasta + more fits. KEY: vocab size (dictionary ka FIXED size ~1 lakh) =/= token count (ek text ki length).","status":"held","deep":"**SAWAL:** *\"Vocab ~1 lakh kyun — 1k ya 10M kyun nahi? 'Compression ratio' ka matlab? 1 token = kitna?\"*\n\n**POORA JAWAB:**\n- **Vocab chhota** → lambi sequences (cost↑). **Vocab bada** → rare tokens **under-trained** + embedding\n  table (**V×d**) bhaari + softmax mehnga. **Sweet spot: 50k-100k.**\n- **Compression ratio = average characters per token.** English ~**4 chars/token**; code/numbers/Hinglish\n  **kam** = zyada tokens = zyada cost.\n- **1 token ≈ ~4 chars ≈ ¾ word.** (NOTE: **0.75 WORD per token**, character nahi — yeh tu recall pe ulta\n  bol gaya tha, weld hua.)\n- **₹81,500 ≈ 6 tukde** (1 token = 1 word NAHI).\n\n**INTERVIEW LINE:** *\"Vocab size is a dial — too small means long sequences and higher cost, too big means\nunder-trained rare tokens and a heavy embedding-plus-softmax table, so industry sits at 50k-100k. Compression\nratio is chars per token, around 4 for English, lower for numbers and Hinglish.\"*"},{"axis":"e","title":"Limits / kab nahi / failure modes","strike":"Rs81,500 aur Rs81,400 - model ko paas-paas (Rs100 farak) lagenge ya bilkul unrelated? Aur iska TDS-decision se kya connection?","weld":"ROOT CAUSE: model TOKENS dekhta, raw characters/digits nahi. 3 FAILS: (1) CHARACTER-COUNT / SPELLING - 'strawberry' -> straw.berry, model ko andar ke letters nahi dikhte -> 'kitne R' galat. Fix: spell-out (s-t-r-a-w...) -> har akshar alag token -> gin sakta. (2) NON-ENGLISH / Rs - list mostly-English (corpus zyada English); Rs ~3 tokens, Hindi/Chinese/emoji zyada tokens -> non-English users ko same baat MEHNGI (real fairness issue). (3) NUMBERS / ARITHMETIC - '81,500' -> 81.,.500; model ko VALUE nahi, tukde dikhte; '81,500' aur '81,400' uske liye ALAG unrelated sequences - Rs100 farak DECODE nahi hota; arithmetic unreliable BY DESIGN. FRONTIER: tokenizer-free (byte/char-level) models in sabko fix kar sakte, par sequence-length cost (char-level problem wapas) se abhi slow/mehnga -> tokenization abhi practical sweet spot. (Aware-level; internals park.)","status":"held","deep":"**SAWAL:** *\"Tokenization kahan TOOT-ti? Hinglish invoice text pe exact risk? strawberry kyun?\"*\n\n**POORA JAWAB:**\n- **Rare string** → **over-fragmentation** (zyada tukde, mehnga + fragile).\n- **Numbers** → **digit-wise tukde** → **arithmetic kamzor** (model digits ki **value** nahi, IDs dekhta).\n- **Vendor typos** (Etibahn vs Etiabhn) → **alag splits** → matching toot-ti → **normalization layer chahiye.**\n- **₹** (rare non-English) → **byte tokens** (byte-fallback).\n- **strawberry → str/aw/berry:** \"strawberry\" **common FRUIT** hai par **STRING ke roop mein rare** → toota.\n  - **THE STRAWBERRY BUG:** model **characters nahi, TOKENS dekhta** → \"strawberry\" = chunks → individual R\n    **dikhte hi nahi** → 3 R's nahi gin paata. Yeh **perception failure, arithmetic nahi.**\n  - **FIX: spell-out** karwa do (s-t-r-a-w-b-e-r-r-y) → har letter apna token → ginti aa jaati.\n\n**INTERVIEW LINE:** *\"It breaks where the string is rare in the vocab — over-fragmentation, digit-level number\nsplits that weaken arithmetic, typo divergence, byte-fallback for non-Latin like ₹. The strawberry bug is a\nperception failure: the model sees tokens, not letters, so it can't count R's — spelling it out forces each\nletter into its own token.\"*"},{"axis":"f","title":"Tradeoffs - vocab size dial","strike":"Badi vocab kam tokens deti (sasta + context bachta) - toh sab 10 lakh / 50 lakh vocab kyun nahi rakh lete?","weld":"TRADEOFF = do achhi cheez ek saath nahi mil sakti (ek behtar karo -> doosri kharab; phone battery jaisa). CHHOTI vocab (~10k): model HALKA (kam vectors yaad) WIN / har text ZYADA tokens (lamba seq -> slow + mehnga) FAIL. BADI vocab (~10 lakh): har text KAM tokens (chhota seq -> sasta) WIN / model BHAARI (har token ko ek vector yaad - laakhon vectors -> training mehngi, slow) + rare tokens UNDER-LEARNED (e.g. 'Aristo' 5x aaya -> token bana par model itni kam baar dekha ki matlab seekh nahi paaya = slot waste) FAIL. KEY: token BANNA (frequency/list-entry, cheap) =/= model ka MATLAB SEEKHNA (baar-baar dekhne se). Sweet spot ~50k-200k = balance (na seq bahut lamba, na model bahut bhaari) - yahi axis-d ke range ka 'kyun'.","status":"held","deep":"**SAWAL:** *\"Letter vs word vs subword — tradeoff, kab kaunsa? Apna FinOps vocab banaun?\"*\n\n**POORA JAWAB:**\n- **Letter:** robust + open-vocab, PAR lambi seq (cost↑).\n- **Word:** short, PAR fragile (OOV).\n- **Subword:** beech — fixed vocab, no OOV, reasonable length = **standard.**\n- **Custom domain vocab tempting** (apna FinOps vocab) — **PAR pretrained ecosystem incompatible** →\n  lock-in. **Standard rakho + upar normalization layer.**\n\n**INTERVIEW LINE:** *\"Three options — characters are robust but long, words are short but fragile, subword is\nthe balanced standard. A custom FinOps vocab is tempting but breaks pretrained-model compatibility, so I keep\nstandard tokenization and add a normalization layer on top.\"*"},{"axis":"g","title":"FinOps build - exact spot + defend-able decision","strike":"Manager: 'Claude powerful hai, 2% nikaal lega - code mein math likhna over-engineering. Convince me. Aur agar main na maanu?'","weld":"SPOTS in FinOps Copilot: (1) PAISA - invoice text -> Claude extraction, tokens = bill; invoices number/Rs-heavy = average se zyada tokens (axis-e); api_logs tokens log (Day-1 observability), DEMO_MODE budget. (2) CONTEXT LIMIT - ek call mein batch size token-bound. (3) NUMBERS BLIND - Rs81,500 = tukde, value nahi. DECISION (Option B): AI sirf NUMBER extract kare (messy text/language samajhna = AI strength), TDS math CODE mein (81500*0.02=1630, deterministic). REASON PRIORITY: CORRECTNESS pehle (model arithmetic unreliable by design; TDS = govt number, 'usually right' = compliance/penalty/audit risk; code = provably exact, har baar), PHIR cost+speed (talwar se macchar - code-able kaam ke liye API call kyun). If manager insists: evidence-based push-back - same 100 invoices AI-math vs code-math, jahan AI off hota woh data dikhao, phir TDS pe risk decide karo. CALCULATOR-TOOL nuance: tool math safe karta PAR model galat INPUT (8,150 vs 81,500) bhej sakta -> tool 'sahi se' GALAT (163); high-stakes mein math AI-flow se BAHAR (code) + code VALIDATE (line-items add = total? cross-check, mismatch -> human). LEVELS: L1 AI-math (FAIL) -> L2 AI+calculator-tool (better) -> L3 extract + code math+validate (BEST). Senior signal = jaanna AI kahan NAHI lagani.","status":"held","deep":"**SAWAL:** *\"FinOps mein tokenization ka EXACT spot? Ek decision defend kar.\"*\n\n**POORA JAWAB:**\n- **EXACT spot:** har Claude call ka **COST METER = tokenization.** Prompt + invoice text **tokens mein\n  billed** (input + output dono).\n- **DECISION (defend-able):** **`api_logs` mein input/output tokens Day-1 se.** Har call ke tokens, latency,\n  cost track.\n- **Framing:** AI propose, **code (token-count) validate** — junior CA, senior approve.\n- **Why it's money:** seedha paisa — bill **tokens pe, words pe nahi.** Hinglish/numbers = zyada tokens =\n  zyada cost → yeh observability Day-1 se chahiye.\n\n**INTERVIEW LINE:** *\"In my FinOps build, tokenization is the cost meter — every Claude call is billed on\ninput plus output tokens, not words. So from Day 1 I log tokens, latency and cost per call in an api_logs\ntable, which makes cost-per-correct-answer measurable.\"*"},{"axis":"h","title":"Scale / cost / prod gotcha","strike":"1 invoice tokenize = chillar. Production mein 1 LAKH invoices/mahina pe kya tootta?","weld":"MATH: 1 lakh invoices x ~500 tokens = 5 cr input + ~2.5 cr output ~= 7.5 cr tokens/mahina. Haiku-class ~Rs0.03/1k -> ~Rs2,250/mo; Opus/Sonnet 10-30x -> Rs20k-60k+. GOTCHA: token cost LINEAR scale karta - 1 invoice ka jo cost, 1 lakh ka theek 1 lakh guna; demo mein invisible, production mein viability decide karta. 3 cheez bigadti: (1) PAISA (model choice 30x farak -> DEMO_MODE + model router), (2) SPEED / latency (har call ~1-3s; 1 lakh serial = hafte -> batching/async/parallel, Month-2 FastAPI/asyncio), (3) RATE LIMITS (API per-min token/request cap -> queue/throttle/backoff). CONNECTION: efficient tokenizer (kam tokens) = seedha paisa bachata at scale; Rs/numbers (axis-e) cost amplify -> smart extraction (sirf zaroori bhejo, poora invoice nahi). LLMOps differentiator (Zomato ops: SLA/cost-per-transaction -> LLMOps: latency/cost-per-inference). Solutions = Bucket-4 / Month-2 ka detail (yahan kaam = 'gotcha pehchanna', 'fix karna' nahi).","status":"held","deep":"**SAWAL:** *\"Scale pe kya tootta? Ek prod gotcha jo zyada log nahi sochte?\"*\n\n**POORA JAWAB:**\n- **Multilingual / language tax (the big gotcha):** vocab mostly **English-trained** → Hindi/non-Latin →\n  **byte-fallback** → **same baat 2-5x zyada tokens** → zyada cost, latency, **kam usable context**,\n  historically kamzor performance. **Fairness issue** bhi.\n- **Tokenizer-change = saare embeddings invalid → migration cost.** \"Model-switch free\" = **myth.**\n- **Cost at scale:** 1 → 1 lakh invoices, token-cost compound hota (cheap vs large model rate — scale slider\n  pe dikhaya).\n\n**INTERVIEW LINE:** *\"The production gotcha is the multilingual token tax — vocabs are English-heavy, so Hindi\nor non-Latin text falls back to bytes and costs 2-5x more tokens, eating cost, latency and usable context.\nAnd switching tokenizers invalidates existing embeddings, so 'model-switch is free' is a myth.\"*"},{"axis":"i","title":"Samjhao 3 ways - CEO / junior / skeptical senior","strike":"Non-technical hiring manager: 'main technical nahi - tokenization se mujhe (business person ko) kya farak padta hai? 30 sec, no jargon.' Phir: 'agar yeh basic step hai, skip kyun nahi kar sakte?'","weld":"CEO / MANAGER (impact, paisa/risk, ZERO mechanism): 'Tokenization woh step hai jahan har text AI ke chhote units mein toot-ta, aur hum un units ke hisaab se pay karte. Toh aapko 3 cheez: PAISA (Rs/numbers/Hindi zyada units = mehnga), LIMIT (AI ek baar mein utna hi dekhta, units mein napa), BHAROSA (AI units pe kaam karta, akshar nahi dekhta -> number-crunching usse mat karwao). Invoice-heavy kaam ka cost+reliability seedha isse judta.' JUNIOR (mechanism + naam): 'Text seedha model mein nahi - tokenizer frozen vocab (~1 lakh subwords) se longest-match lookup se todta, har token ka ID; BPE ne vocab pehle train ki (common=pura token, rare=sub-tukde); model IDs pe chalta, raw chars pe nahi.' SKEPTIC SENIOR (tradeoffs + limits + defense): 'Subword kyunki word-level vocab-phatta+OOV, char-level lamba-seq; vocab size khud tradeoff, sweet-spot ~50k-200k; key limit - model tokens dekhta chars nahi -> spelling/arithmetic blind, isliye high-stakes math deterministic code mein; cost linear scale -> observability day-1.' SKIP kyun nahi: AI math pe chalta -> text se number bridge unavoidable; 'pura text ek saath' nahi kyunki har word/sentence ko number = infinite (vocab-phatta). Frontier tokenizer-free explore ho raha par sequence-length cost se abhi tokenization practical.","status":"held","deep":"**SAWAL:** *\"Ek hi cheez — tokenization — teen logon ko samjhao.\"*\n\n**POORA JAWAB (threeWays, threads se):**\n\n**🟦 CEO:** *\"Dictionary ka size ek dial — bada karo to padhna sasta par seekhna kamzor; chhota ulta. Jo\ndictionary mein rare hai woh mehenga + fragile — hamare vendor names exactly wahi category. Har Claude call\nka bill in tukdon pe.\"*\n\n**🟨 JUNIOR:** *\"Train: most-frequent adjacent pair count → merge → repeat ~50k times → merge rules. Apply:\ngreedy longest-match on frozen vocab, deterministic, no re-learning. Token → ID → (embedding alag stage). V\ntrades sequence-length vs embedding params (V×d) + softmax. Compression = chars/token; lower = more tokens =\nmore cost.\"*\n\n**🟥 SKEPTIC:** *\"Greedy ≠ optimal — edge cases mein ugly splits, par deterministic + fast = prod-standard.\nCompression language-biased — multilingual vocab English-heavy, Hinglish same text pe zyada tokens = zyada\ncost. Tokenizer-change = embeddings invalid → migration cost. 'Model-switch free' myth. WordPiece/Unigram\nalternatives, tradeoff same.\"*\n\n**INTERVIEW VALUE:** Register-switching = \"Product\" muscle."}],"threeWays":{"ceo":"Tokenization wo step hai jahan har text AI ke chhote units mein toot-ta, aur hum un units ke hisaab se pay karte. 3 cheez: paisa (Rs/numbers/Hindi zyada units = mehnga), limit (AI ek baar mein utna hi dekhta), bharosa (number-crunching AI se mat karwao). Aapke invoice-heavy kaam ka cost+reliability seedha isse judta.","junior":"Text seedha model mein nahi jaata - tokenizer ek frozen vocabulary (~1 lakh subwords) se longest-match lookup se todta, har token ka ID banta. BPE ne wo vocab pehle train ki - common words pura token, rare words sub-tukdon mein. Model in IDs pe kaam karta, raw characters pe nahi.","skeptic":"Subword isliye - word-level vocab phatta + OOV, char-level sequence lamba. Vocab size khud tradeoff: chhoti = lambe sequences, badi = bhaari model + under-learned rare tokens, sweet spot ~50k-200k. Key limit - model tokens dekhta characters nahi, isliye spelling aur exact arithmetic mein blind; high-stakes math maine deterministic code mein rakha. Cost linear scale karta, isliye observability day-1."},"traps":[{"bait":"Subword ka primary faayda = ek tukde (straw, berry) se bahut saare naye words bana sakte.","wrong":"Reuse ek bonus hai, headline nahi.","truth":"Primary = OOV solve + vocab kaabu (unseen word pe model atakta nahi). Mohana/Aristo Eco example se lead karo, 'itne words bana sakte' se nahi."},{"bait":"Factory list banate waqt sabse repetitive WORDS uthake daal deti hai.","wrong":"Words daale nahi jaate.","truth":"Letters se shuru, sabse frequent adjacent PAIR glue karke tokens BANTE hain. 'common=1 token' result hai; rule = pair frequency."},{"bait":"Runtime pe pehla/chhota matching substring uthata hai.","wrong":"Pehla/chhota nahi.","truth":"LONGEST match - us position se sabse bada known tukda. Warna char-by-char (7 tukde) ban jaata."},{"bait":"Runtime pe naye word ke liye naya token CREATE hota hai.","wrong":"Phase B kuch banata nahi.","truth":"Existing tokens PICK karke ID deta. Create = Phase A (factory) only."},{"bait":"Frozen vocab hai toh COVID/ChatGPT jaise naye words pe model CRASH karega.","wrong":"Crash nahi.","truth":"Base letters hamesha vocab mein -> worst-case single letters; co.vid. OOV = zyada tukde, fail nahi."},{"bait":"Token count ~= characters % 4.","wrong":"% = modulo/remainder (programming), galat operator.","truth":"DIVIDE chahiye - characters / 4. (17%4=1 par 17/4~=4 tokens; baatna hai.)"},{"bait":"1 token ~= 0.75 character.","wrong":"Unit swap.","truth":"1 token ~= ~4 CHARACTERS ~= ~0.75 WORD. Token < word."},{"bait":"Char-level ka problem memory hai - corpus infinite nahi.","wrong":"Ulta - char-level vocab SABSE CHHOTI (~256).","truth":"Char-level memory KAM. Problem = sequence bahut LAMBA (slow) + meaning bikhri. Memory-explosion WORD-level ki samasya hai."},{"bait":"Cosine/embedding se model samajh jaayega 81,500 ~= 81,400 paas hain.","wrong":"Cosine = semantic similarity, arithmetic nahi.","truth":"Rs100 farak = arithmetic fact; cosine kabhi nahi nikaalta. Model ke liye dono ALAG token-sequences, value-relation pata nahi."},{"bait":"Calculator tool de diya toh answer 100% correct, code-math ki zaroorat nahi.","wrong":"Tool math safe, par model galat INPUT bhej sakta.","truth":"Tool 81500*0.02 pakka karta, par model 8,150 bhej de toh tool 'sahi se' GALAT (163). High-stakes: math AI-flow se bahar (code) + code validate."},{"bait":"Latest Claude powerful hai, 2% nikaal lega - code-math over-engineering.","wrong":"Cost ek baat, asli reason = correctness.","truth":"Arithmetic unreliable by design; TDS govt-number, 'usually right' = compliance risk. Code = provably exact, har baar."}],"bridges":[{"to":"embeddings","conn":"tokenization -> embeddings","q":"Tokenization ID-list pe khatam - phir un IDs ka kya hota hai?","a":"Har ID ko ek meaning-vector embedding deti (LEARNED, sirf 'stored' nahi). Tokenization = text->IDs; embeddings = IDs->meaning. Tera duplicate-vendor detection (Aristo vs Aristo Eco) embeddings pe khada."},{"to":"context-window","conn":"tokens -> window","q":"Context window 'tokens' mein kyun napa jaata, words mein kyun nahi?","a":"Window = model ki working memory (single pass), tokens mein napi (128k = 128k tokens). Prompt+history+response sab usme. Efficient tokenizer = zyada content fits; Rs/numbers zyada tokens = window jaldi bharti. Bade docs -> RAG (relevant chunks retrieve)."},{"to":"hallucinations","conn":"numbers-blind -> confident-wrong","q":"Tokenization ki arithmetic-weakness hallucinations se kaise judti?","a":"Model value nahi tukde dekhta -> number/math confidently GALAT bol deta (fluent fabrication). Counter = AI proposes, code validates, human approves."},{"to":"tooluse","conn":"calculator-tool -> function calling","q":"Numbers-blind ka tool-use solution kya, aur uski limit?","a":"Model ko calculator tool do -> woh call kare, code chalaye, result wapas. Par high-stakes mein math code mein (AI-flow se bahar) + validate, sirf 'delegate' nahi. Tool use = AI ko 'haath' dena; FinOps optimizer/what-if isi pe khada."}],"doubts":[{"q":"strawberry common fruit hai, phir split kyun hota hai?","a":"common-FRUIT =/= common-STRING. Tokenizer ko meaning nahi, string-frequency dikhti. 'straw'/'berry' bahut words mein aate, 'strawberry' kam - isliye split."},{"q":"Rs ek symbol hai, par kitne tokens?","a":"~3 tokens. Rs rare non-English -> bytes mein toot-ta. Non-English/symbols English se zyada tokens khaate."},{"q":"Notes/examples mein jo token-splits dikhaaye (jaise straw·berry) — woh EXACT hain ya illustrative? GPT aur Claude same word ko alag tod sakte?","a":"Nahi - illustrative/approximate. Real tokenizer (GPT vs Claude) alag tukde de sakta. Pattern pakka, exact split nahi - har baar disclaim karo."},{"q":"Corpus exactly kya hota hai?","a":"Training corpus = web-scrape + books + code, cleaned. Yahin se vocab BPE banti. Interview-word = 'corpus' ya 'training corpus'."},{"q":"BPE jab vocab banati hai (training), kya woh sabse frequent poore WORDS ko token banati — ya letters se shuru karke frequent adjacent PAIRS ko glue karti?","a":"Nahi - letters se shuru, sabse frequent adjacent PAIR glue karke tokens BANTE. 'common=1 token, rare=tukde' result hai; method = pair-frequency glue."},{"q":"BPE ke do phase — training (vocab banti) aur runtime (vocab use hoti) — mein se kaun KAB chalta hai: ek baar, ya har prompt pe?","a":"Phase A (factory) = BUILD, EK baar, release se pehle. Phase B (AI/tu) = USE, HAR baar, har prompt. Build once vs use every-time."},{"q":"Naya word (Etibahn/Mohana) - kaise todega? Naya token daalega?","a":"Naya token nahi banta. Longest-match se existing subwords/letters mein todta (Eti.bahn). Base letters hamesha vocab mein -> kuch bhi handle ho jaata."},{"q":"Frozen vocab hai toh COVID jaise naye words pe crash?","a":"Crash nahi. Worst-case single letters; co.vid. OOV = zyada tukde, fail nahi. Koi bhi text hamesha tokenize ho jaata."},{"q":"Vocab size aur token count same hain?","a":"Alag. Vocab size = dictionary ka FIXED size (~1 lakh). Token count = ek specific text ki length (Aristo Eco-Rs81,500 ~= 8). Dono 'tokens' mein par alag cheez."},{"q":"Ek hi baar corpus mein aaya word, token to ban hi jaata na?","a":"Token BANNA cheap (frequency/list-entry). Par model us token ka MATLAB baar-baar dekh ke SEEKHta - 5x aaya rare token = bana par under-learned = slot waste."},{"q":"Token count = characters % 4?","a":"% = remainder (programming). DIVIDE chahiye: characters / 4. (17/4 ~= 4 tokens.)"},{"q":"1 token ~= 0.75 char?","a":"Unit swap. 1 token ~= ~4 CHARACTERS ~= ~0.75 WORD."},{"q":"Char-level ka problem memory hai (corpus infinite nahi)?","a":"Ulta - char-level vocab SABSE CHHOTI (~256). Problem = sequence LAMBA → attention O(N²) compute mehnga (na memory, na retrieval-slow — dono galat guess) + meaning bikhri. Memory-explosion word-level ki."},{"q":"Rs81,500 aur Rs81,400 model ko paas lagenge?","a":"Nahi - uske liye ALAG unrelated token-sequences. Rs100 farak DECODE nahi hota. Cosine (semantic similarity) yeh kabhi nahi nikaalta - woh meaning ki nazdeeki, arithmetic nahi."},{"q":"Calculator tool de diya toh answer 100% correct?","a":"Tool math safe, par model galat INPUT (8,150 vs 81,500) bhej sakta -> tool 'sahi se' galat. High-stakes: math AI-flow se BAHAR (code) + code validate (line-items add = total?)."},{"q":"AI extraction bhi galat ho sakta - toh AI ka fayda kya? Validate kaise/kaun?","a":"AI strength = messy invoice -> structured number (code easily nahi kar paata). Code strength = exact math + VALIDATE (line-items add karke total se cross-check; mismatch -> human). Extraction galti CATCHABLE (cross-check), AI-arithmetic galti SILENT. AI proposes, code validates, human approves."},{"q":"Manager: latest Claude 2% nikaal lega, code-math over-engineering?","a":"Cost ek baat, asli = CORRECTNESS. Arithmetic unreliable by design; TDS govt-number, 'usually right' = compliance risk. Code = provably exact. Na maane -> data dikhao (AI-math vs code-math 100 invoices)."},{"q":"Tokenization-free models kya hain?","a":"Byte/char-level directly - axis-e fixes (R-count, Rs, numbers). Par sequence-length cost (char problem wapas) -> slow/mehnga. Tokenization abhi practical sweet spot. (Aware-level; internals park.)"},{"q":"Straw=1 R, berry=2 R - model ne 1+2=3 add kyun nahi kiya, ek hi answer kyun?","a":"Galat picture - model 'straw mein 1, berry mein 2' DEKH ke add bhoola nahi. Sach: model letters dekhta HI nahi. 'straw' ek single token = ek ID; andar ke s-t-r-a-w uske liye invisible. Toh add karne ke liye '1' aur '2' uske paas HAIN hi nahi - yeh addition failure nahi, PERCEPTION failure. Spell-out (s-t-r-a-w-b-e-r-r-y, har letter apna token) se model gin sakta. Sahi answer = 3 (straw 1 + berry 2)."},{"q":"BPE ek round mein kya karti — poore corpus ke saare adjacent pairs ek saath count karke sabse frequent EK merge, ya ek-ek letter pick karke uske pairs count?","a":"Poore corpus ke SAARE adjacent pairs ek saath count → sabse frequent EK pair merge (ek round = ek merge) → repeat ~50k baar → merge-rules freeze. 'Letter pick karke pairs' waala shape GALAT. (6/30 Re-Jirah crack.)"},{"q":"'Sequence length' ka matlab exactly kya — tokens ki list ki lambai (kitne tokens ban-e), ya kuch aur?","a":"Tokens ki list ki lambai = us text ke kitne tokens ban-e. Zyada tokens = lambi sequence (isliye char-level, jo har char ko token banata, sabse lambi sequence deta)."},{"q":"Runtime pe (har prompt) token ki ID kahan se aati — frozen vocab se ya corpus se? Aur corpus kab use hota?","a":"Runtime (PHASE B): ID sirf frozen VOCAB se lookup. Corpus SIRF training (PHASE A) mein use hota tha (vocab + merge-rules banane); runtime pe corpus ka koi role nahi."},{"q":"BPE ke merge-rules kahan store hote — vocab ke saath tokenizer ke andar, ya kahin alag?","a":"Tokenizer ke andar, vocab ke saath — dono ek jagah freeze. (Vocab = tukde + unke IDs; merge-rules = kis order pairs merge hue — alag cheezein par saath store.) Runtime pe wahi rules longest-match se apply."},{"q":"Runtime pe BPE 'greedy' apply hoti — greedy ka matlab yahan kya, longest-match?","a":"Haan — greedy = har position pe sabse bada KNOWN tukda (longest matching subword) pehle uthao, phir aage. Runtime pe re-counting nahi; frozen merge-rules longest-match se apply."},{"q":"Socha char/word-level ka asli nuksaan yeh hai ki dictionary lookup slow ho jaata (retrieval mehnga). Phir laga — vocab to sirf ek table hai, usme dhoondhna toh fast hona chahiye. Toh lookup free hai ya nahi, aur agar free hai toh char aur word ka asli kharcha KAHAN aata — dono ka ek jagah ya alag-alag?","a":"Lookup basically FREE hai — hash-table O(1), vocab jitni bhi badi ho dhoondhne ka time nahi badhta. Toh kharcha lookup mein hai hi nahi. Asli kharcha DO alag jagah, do alag axes pe: (1) CHAR-level → ek word bahut saare tokens ('i·n·v·o·i·c·e' = 7) → sequence LAMBI → attention O(N²) → processing mehnga; yahan villain = sequence-length. (2) WORD-level → har unique word ek token → vocab HUGE (laakhon) → embedding-table bhaari (memory + har token ka apna vector) + rare words 5x hi aaye toh under-trained; yahan villain = vocab-size. Ek line: sequence-length char ko maarti, vocab-size word ko. Lookup dono mein negligible. Subword dono villains ko beech mein pakadta — na sequence phategi, na vocab."},{"q":"Socha char-level tokenization 'meaning distort' kar deti hai — tukde karke matlab bigad jaata. Phir ruka: tokenization to meaning samajhti hi nahi, woh sirf text ko tokens/IDs mein badalti (zero meaning). Toh agar tokenization mein meaning hai hi nahi, phir char-level 'meaning' ko hurt kaise kar sakti?","a":"Sahi pakda — tokenization mein meaning ZERO. Meaning AAGE banti: token-ID → embedding-vector, phir attention context jodta. Toh char-level ka nuksaan tokenization ke ANDAR nahi hota — woh downstream ko diye BURE raw-material mein hota. Ingredient jaise soch: 'invoice' ek token = ek dumdaar, meaning-bhara ingredient (ek jagah, ek clean vector). 'i' ek token = bekaar — 'invoice', 'India', 'ice' sab mein aata, uska vector kisi ek cheez ko point nahi karta. Char-level har word ko aise bekaar tukdon mein tod deta → downstream ko ghatiya ingredients milte → meaning banane mein zyada mehnat, kam accuracy. Tokenization ne meaning 'distort' nahi ki; usne downstream ka kaam MUSHKIL kar diya. Cost andar nahi — jo aage bheja usme."}],"calibration":"Nikhil ne Jirah se PEHLE khud bola: 'main abhi sab axes pe weak hoon, revision karke strong banunga' = predicted LOW confidence across-the-board. ACTUAL Jirah: saare 9 axes defended; ek crack (axis-e, '81,500 ~= 81,400 cosine se') jo turant welded; aur khud sophisticated counter-questions uthaye (calculator-tool nuance) = genuine understanding, ratta nahi. GAP: self-predicted weak << Jirah-actual held. Yeh gap = RETENTION/confidence ki kami (capsule FRESH hai, abhi Re-Jirah nahi hua), COMPREHENSION ki nahi. Mid-learning slips (% vs /, char-vs-word unit, char-level memory, cosine trap) fragility suggest karti -> Re-Jirah (day-3 cold widget start) confidence weld karega. NOTE: status JIRAH-result hai (rule: self-rating se nahi); Nikhil ka 'weak feel' valid aur Re-Jirah se address hota, status se nahi. | 6/30 Re-Jirah (partial — axes a/b/c cold, ~15-din decay): 3 cracks welded — (i) char-level dard = sequence-length O(N²) + meaning-bikhri (na memory, na retrieval-slow — dono inverted the guess), (ii) BPE = all-pairs-at-once + one-merge-per-round (letter-pick shape galat tha), (iii) runtime ID frozen vocab se, corpus nahi + greedy = longest-match. Do-phase (build-once vs use-every-time) ab English-deliverable. Axes d–i abhi Re-Jirah-pending — full round incomplete, isliye reJirahDone [] (koi due-date log nahi).","buildHook":"FinOps Copilot: invoice extraction (AI) -> tokens = api_logs cost (Day-1 observability) + DEMO_MODE budget. TDS/amount math = deterministic CODE (Option B), AI sirf number extract + code validate (line-items vs total). Vendor names (Aristo / Aristo Eco / Etibahn - rare proper-nouns, corpus mein nahi) = subword tokenization se handle (word-level use useless karta). Yeh poora 'AI proposes, code validates, human approves' ka tokenization-grounded 'kyun'. Module 3 procurement: Rs/numbers heavy -> token-cost amplify -> smart extraction.","interviewLines":["AI doesn't understand language, only numbers. Tokenization is the bridge: it breaks text into vocabulary pieces and assigns each an ID. Every LLM starts here.","Subword tokenization beats word-level (which explodes the vocabulary and breaks on unseen words) and char-level (which makes sequences too long and scatters meaning). Common words become one token, rare words split into chunks.","Even with a frozen vocabulary, the model never crashes on unseen words. Base characters are always in the vocab, so worst case a new word splits into smaller pieces. OOV means 'more tokens', not 'failure'. Any text always tokenizes.","One token is roughly 4 characters or 0.75 of a word. Tokens are the currency, so more tokens means more cost and a context window that fills faster.","LLMs are unreliable at exact arithmetic by design. They see number-tokens, not values. '81,500' and '81,400' are unrelated sequences to the model; it can't decode the 100 difference. So I keep high-stakes math in deterministic code.","Vocabulary size is itself a tradeoff: a small vocab means long sequences, a large vocab means a heavier model with poorly-learned rare tokens. 50k to 200k is the sweet spot.","A calculator tool makes the arithmetic safe, but the model can still pass the wrong number into it. For high-stakes TDS I take the math entirely out of the model's hands and let code validate the extracted number against the invoice total. AI proposes, code validates, human approves.","Knowing where NOT to use AI is the senior signal. AI reads messy invoices, which only AI can do; code does exact math and validation, which code does best.","There's active research on tokenizer-free models working directly on bytes, which would fix character and number weaknesses, but they hit the sequence-length problem, so tokenization remains the practical sweet spot."],"bolo":"AI ek calculator jaisa hai jisko by-default sirf numbers samajh aate, language nahi. Tokenization har AI ka pehla step - text ko vocab ke tukdon (tokens) mein todta, har tukde ka ID number. Vocab factory ek baar banati BPE se (sabse frequent adjacent letter-pair glue karke, ~1 lakh tak), phir woh frozen. Main (AI) har baar use longest-match se lagata - naya word aaye to subwords mein tod deta, crash nahi karta. Subword isliye: word-level vocab phatta + OOV (Mohana, Aristo Eco), char-level sequence lamba + slow. Model tokens dekhta characters nahi - isliye strawberry mein R-count aur exact arithmetic mein kamzor. FinOps mein: AI number extract kare (uski strength), paisa-math code mein (correctness - TDS govt number hai), code validate kare, human approve.","bolo_by":"- Nikhil, Jirah-tested (FRESH - Re-Jirah day-3 pending)","viz":"bpe","deep":"### HOOK\n**₹81,500** ka invoice AI ke saamne — par AI ko \"₹81,500\" **dikhta hi nahi.** Use teen alag tukde dikhte:\n`81` · `,` · `500` (ya digit-wise). Yahin se har LLM ki kahani shuru hoti hai — aur yahin tera FinOps ka\n**cost-meter** baithta hai.\n\n### MECHANISM (ek saans mein)\nAI sirf **numbers** samajhta, language nahi. Tokenization = text ko **vocab ke tukdon (tokens)** mein todna +\nhar ka **ID number.** Vocab **EK baar** BPE se banti (sabse frequent character-pairs merge), phir **FREEZE.**\nRuntime pe koi nayi ginti nahi — **frozen rulebook** har prompt pe **greedy longest-match** apply karta.\n\n### THE ONE PICTURE\n```\n\"Aristo Eco — ₹81,500\"\n   │\n   ▼  frozen VOCAB se greedy longest-match\n   │     [\"Ar\",\"isto\",\" Eco\",\" —\",\" ₹\",\"81\",\",\",\"500\"]   ← rare=\"Aristo\"→toota, common stays whole\n   ▼  har token → fixed ID number (vocab index)\n   │     [4823, 901, 5567, 88, 712, 41, 9, 233]\n   ▼  yeh ID-list = model ka input (step ZERO)\n   │     ↓ (aage embeddings: ID → meaning-vector — ALAG stage)\n```\n**Tokenization yahin khatam — output = IDs ki list. Numbers aage combine NAHI hote.** Embeddings alag stage.\n\n---"}];
const GIST = "https://gist.githubusercontent.com/nikhil1429/ce50c28d585c2fcd915a9dbf61871a56/raw";
let CAPS = SNAP.slice(); let current = 0;

// FORGE_DESIGN §4 completeness: fields with a designed section. Anything NOT in
// this list still renders, via the generic walker — a new field can never be
// silently skipped again (the v2 deep-render scar).
const PLACED = ["id","num","title","status","dot","lockedOn","stream","source","hook","why","mechanism",
  "bolo","bolo_by","faultLines","threeWays","traps","bridges","interviewLines","doubts","calibration",
  "buildHook","viz","deep","reJirahDone"];

const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pretty = v => typeof v === "string" ? esc(v) : esc(JSON.stringify(v, null, 2));
const sec = (t, body) => body ? `<section><h3>${esc(t)}</h3>${body}</section>` : "";
const prose = v => v == null ? "" : `<pre>${pretty(v)}</pre>`;

function render(i){
  current = i; const c = CAPS[i];
  document.querySelectorAll("#nav button").forEach((b, j) => b.classList.toggle("on", j === i));
  const fl = (c.faultLines || []).map(a => `
    <div class="axis ${esc(a.status || "")}">
      <h4>${esc(a.axis)} — ${esc(a.title)} <span class="pill">${esc(a.status || "?")}</span></h4>
      <div class="strike">${esc(a.strike || "")}</div>
      <div class="weld">${esc(a.weld || "")}</div>
      ${a.deep ? `<details><summary>deep — poora khol</summary><pre>${pretty(a.deep)}</pre></details>` : ""}
      ${Object.keys(a).filter(k => !["axis","title","strike","weld","status","deep"].includes(k)).map(k => `<div class="kv">${esc(k)}: ${pretty(a[k])}</div>`).join("")}
    </div>`).join("");
  const doubts = (c.doubts || []).map(d => `<li><pre style="margin:0">${pretty(d)}</pre></li>`).join("");
  const extra = Object.keys(c).filter(k => !PLACED.includes(k));
  const el = document.getElementById("main");
  el.innerHTML = `
    <h2>${esc(c.num || "")} · ${esc(c.title || c.id)} ${c.dot ? `<span class="pill">${esc(c.dot)}</span>` : ""}</h2>
    <div class="meta">id ${esc(c.id)} · status ${esc(c.status || "?")} · locked ${esc(c.lockedOn || "—")} · stream ${esc(c.stream || "—")} · source ${esc(c.source || "—")}</div>
    ${sec("Hook", prose(c.hook))}
    ${sec("Why", prose(c.why))}
    ${sec("Mechanism", prose(c.mechanism))}
    ${sec("Bolo — the sacred out-loud answer" + (c.bolo_by ? " · by " + esc(c.bolo_by) : ""), prose(c.bolo))}
    ${sec("The 9 fault lines (Re-Jirah axes)", fl)}
    ${sec("Three ways", prose(c.threeWays))}
    ${sec("Traps", prose(c.traps))}
    ${sec("Bridges", prose(c.bridges))}
    ${sec("Interview lines", prose(c.interviewLines))}
    ${sec("Doubts — his real ones, verbatim (" + (c.doubts || []).length + ")", doubts ? `<ul>${doubts}</ul>` : "")}
    ${sec("Calibration", prose(c.calibration))}
    ${sec("Build hook", prose(c.buildHook))}
    ${sec("Viz", prose(c.viz))}
    ${sec("Deep — the god-tier re-learn layer", prose(c.deep))}
    ${sec("Re-Jirah rounds done (due-dates served)", (c.reJirahDone || []).length ? `<ul>${c.reJirahDone.map(d => `<li>${esc(d)}</li>`).join("")}</ul>` : "<div class='kv'>none yet — R1 abhi baaki</div>")}
    ${extra.length ? sec("⚠ Fields with no designed section yet (rendered raw — never skipped)", extra.map(k => `<div><b>${esc(k)}</b>${prose(c[k])}</div>`).join("")) : ""}
    <div class="foot">completeness: <span class="${extra.length ? "warn" : "ok"}">${Object.keys(c).length} data fields · ${Object.keys(c).length - extra.length} designed + ${extra.length} raw — 0 skipped</span></div>`;
  window.scrollTo(0, 0);
}

function nav(){
  document.getElementById("nav").innerHTML = CAPS.map((c, i) =>
    `<button onclick="render(${i})">${esc(c.num || "")} ${esc(c.title || c.id)}<br><span class="st">${esc(c.status || "?")} · ${(c.faultLines || []).length} axes · ${(c.doubts || []).length} doubts</span></button>`).join("");
}

// live gist first (FORGE_SPEC §1 intended), SNAP is the never-empty floor.
(async () => {
  nav(); render(0);
  try {
    const fresh = await Promise.all(SNAP.map(c =>
      fetch(`${GIST}/${c.id}.json`, { cache: "no-store" }).then(r => r.ok ? r.json() : null).catch(() => null)));
    if (fresh.every(Boolean)) { CAPS = fresh; document.getElementById("srcmode").textContent = "LIVE gist"; nav(); render(current); }
  } catch {}
})();
</script></body></html>
