\n**INTERVIEW LINE:** *\"Brute-force compares the query to every vector — O(n²), too slow at scale, and it's a\ncompute cost, not LLM tokens. So I put an HNSW index on pgvector: it organizes vectors once so each search\nonly scans a small relevant subset, sub-second. It's approximate — true-nearest can sit across a cluster\nborder — but recall is ~95-99% and code confirms GST exactly, so the ₹81-crore call never rests on\napproximation. The clustering is internal; I just enable the index and query.\"*"},{"axis":"i","title":"Samjhao 3 ways","strike":"CEO / junior / skeptical senior - teen ko embedding samjhao.","weld":"(see threeWays) KEY: teeno mein EMBEDDING khud describe ho (vector banana + uski limit), search/cosine/ANN MAT ghusana - woh ALAG concept (vectors ka use). Glue-galti (embedding == cosine) baar-baar aayi thi - axis-i pe khud alag ki.","status":"held","deep":"**SAWAL:** *\"Ek hi cheez — embedding — teen logon ko samjhao: CEO (business), junior (mechanics), skeptical\nsenior (tradeoffs). Register switch kar.\"*\n\n**POORA JAWAB (sharpened 21 Jun — verbatim threeWays):**\n\n**🟦 CEO (business):** *\"Yeh embedding business ko FAST processing deta hai. Bade DB pe sirf code se\nduplicate dhoondho → ek vendor ko baaki sab se compare → query slow → user wait → kharab experience.\nEmbedding se wahi kaam **fraction-of-second** mein → elite user experience, jo kisi bhi company ki top\npriority. Saath: cleaner data, kam manual kaam, kam errors on ₹81 crore decisions.\"*\n\n**🟨 JUNIOR (mechanics):** *\"Tokenization word ko random ID deta (koi meaning nahi). Embedding us ID ke\nagainst embedding matrix se vector nikalta, aur ek vendor naam ke saare token-vectors ko **POOL** karke **EK\nfinal vector** deta. Do type: **STATIC** (purana — context-blind, ek word = ek fixed vector, polysemy pe\ntootta) aur **CONTEXTUAL** (model pura sentence padh ke har token ko padosi-shabdon se samajh ke pool karta →\nsame word alag context = alag vector). Dono **SEMANTIC** (meaning capture karte). Vector corpus se **SEEKHA**\n— main pre-trained API call karta, train nahi.\"*\n\n**🟥 SKEPTIC (tradeoffs):** *\"Do limit: static **polysemy** pe tootta ('bank' nadi vs paisa) → **contextual**\nuse karta; aur similarity 'shaayad same' deta, pakka nahi → high-stakes pe **code (GST exact)** se confirm.\nVector size **COMPLEXITY** se chunta (naam simple = 384), count/importance se nahi. Scale pe brute-force\ncosine **O(n²)** slow → **ANN (HNSW)** index, two-phase (centroids → cluster), sub-second; approximate par\nrecall ~95-99% + GST funnel safe. **KEY: similarity = retrieval/recall; GST = identity/precision — alag\nsawaal.\"*\n\n**JAHAN TU ATKA → WELD (the glue-galti):** Is axis pe tu **baar-baar \"embedding == cosine/search\"** mix\nkarta tha — embedding samjhate-samjhate cosine/ANN ghusa deta. **Correction (KEY):** teeno register mein\n**EMBEDDING khud** describe ho (vector banana + uski limit) — **search/cosine/ANN MAT ghusao**, woh **ALAG\nconcept** (vectors ka USE). Yeh glue-galti tu ne **axis-i pe khud alag ki** — yahi register-discipline\n\"Product muscle\" hai.\n\n**INTERVIEW VALUE:** Register-switching = woh \"Product\" wala muscle jo AI **Product** Engineer maangta hai."}],"threeWays":{"ceo":"Yeh embedding business ko FAST processing deta hai. Bada DB pe sirf code se duplicate dhoondho -> ek vendor ko baaki sab se compare -> query slow -> user wait -> kharab experience. Embedding se wahi kaam fraction-of-second mein -> elite user experience, jo kisi bhi company ki top priority. Saath: cleaner data, kam manual kaam, kam errors on Rs81 crore decisions.","junior":"Tokenization word ko random ID deta (koi meaning nahi). Embedding us ID ke against embedding matrix se vector nikalta, aur ek vendor naam ke saare token-vectors ko POOL karke EK final vector deta. Do type: STATIC (purana - context-blind, ek word = ek fixed vector, polysemy pe tootta) aur CONTEXTUAL (model pura sentence padh ke har token ko padosi-shabdon se samajh ke pool karta -> same word alag context = alag vector). Dono SEMANTIC (meaning capture karte). Vector corpus se SEEKHA - main pre-trained API call karta, train nahi.","skeptic":"Do limit: static polysemy pe tootta ('bank' nadi vs paisa) -> contextual use karta; aur similarity 'shaayad same' deta, pakka nahi -> high-stakes pe code (GST exact) se confirm. Vector size COMPLEXITY se chunta (naam simple = 384), count/importance se nahi. Scale pe brute-force cosine O(n^2) slow -> ANN (HNSW) index, two-phase (centroids -> cluster), sub-second; approximate par recall ~95-99% + GST funnel safe. KEY: similarity = retrieval/recall; GST = identity/precision - alag sawaal."},"traps":[{"bait":"Bada vector hamesha behtar - zyada numbers = zyada accuracy.","wrong":"Bada = sirf jab text PECHEEDA (kai meaning-layers).","truth":"Vendor naam = 1 layer (identity), lamba bhi ho -> chhota (384) perfectly pakadta. Bada = zero asli fayda + dheema + zyada storage. Decide complexity se, lambai/importance se nahi."},{"bait":"Embedding = do words ka cosine angle nikalna (similarity).","wrong":"Cosine ALAG step hai, embedding nahi.","truth":"Embedding = vector BANATA (ID->meaning-vector). Cosine/ANN = un vectors ko USE karke search. Do alag cheez - inhe mat mila."},{"bait":"Vector vendor ke corpus/training-text mein store hota.","wrong":"Nahi - embedding matrix (lookup table) mein.","truth":"Corpus = raw text (vocab+matrix BANANE ko, ek baar, phir phenk do). Prompt pe model corpus nahi - frozen embedding matrix se vector lookup."},{"bait":"Vector = key-value pairs {vendor:0.9, eco:0.95}.","wrong":"Naam-label nahi hote.","truth":"Vector = plain numbers ki fixed-length line [0.9, 0.2, ...]. 'vendor-pana/eco-pana' sirf teaching ki kahani - asli numbers nameless, model ne khud adjust kiye."},{"bait":"Indexing embedding ka part hai.","wrong":"Alag layer hai.","truth":"Embedding = vector BANANA (yahin khatam - ek naam ek pooled vector). Indexing = banaye hue vectors ko fast-search ke liye ORGANIZE (ANN). Speed ka kaam, embedding ka nahi."},{"bait":"Indexing polysemy/meaning ka problem fix karta.","wrong":"Galat layer.","truth":"Indexing = SPEED problem (laakhon vectors fast search). Polysemy = MEANING problem -> fix = CONTEXTUAL embedding. Do alag duniya, mat mila."},{"bait":"Semantic embedding ek teesra type hai (static / contextual / semantic).","wrong":"Semantic type nahi, ADJECTIVE hai.","truth":"Static AUR contextual DONO semantic (dono meaning capture karte). Type = static vs contextual (purana vs naya); semantic = unka quality. Teesra type NAHI."},{"bait":"Embedding proximity / similarity batata hai.","wrong":"Embedding similarity nahi deta.","truth":"Embedding pooled VECTOR deta; PROXIMITY/similarity COSINE batata. Do alag steps - embedding pehle (vector), cosine baad (number)."},{"bait":"Centroid kisi vendor ka pooled vector hai.","wrong":"Stored vendor ka nahi.","truth":"Centroid = cluster ke saare vectors ki AVERAGE position (ek synthetic point/vector). Kisi ek naam ka vector nahi - banaya-gaya center."},{"bait":"Brute-force scale pe zyada LLM tokens khaata = mehnga.","wrong":"Cosine tokens nahi khaata.","truth":"Cosine/search = compute op (DB pe), LLM tokens NAHI. Tokens/paisa embedding banane ke API call pe. Brute-force ka problem = COMPUTE/SPEED, tokens nahi."},{"bait":"Similarity threshold guess ya hard-code kar lo.","wrong":"Guess = junior move.","truth":"Golden dataset (labelled pairs) pe TUNE + precision/recall/F1 se measure. Junior hard-code, senior measure."},{"bait":"API har subword ka alag vector deta (per-token).","wrong":"Per-token nahi.","truth":"API pure input string ka EK pooled vector deta. 'Aristo Eco' = ek vector, teen nahi -> 2397 naam = 2397 vectors."}],"bridges":[{"to":"tokenization","conn":"tokenization -> embeddings","q":"Embedding ka input kahan se aata?","a":"Tokenization ka output = ID-list, wahi embedding ka input. word->ID (tokenization)->vector (embedding). Output of one = input of next."},{"to":"inference","conn":"embeddings -> inference","q":"IDs ko meaning-vectors mil gaye - ab model in vectors se agla token kaise nikaalta?","a":"Inference = vectors -> next-token probabilities -> sampling. Embeddings input ka meaning deta; inference us meaning se output banata."},{"to":"context","conn":"embeddings -> context window","q":"Lambe document ke saare vectors ek saath process honge?","a":"Context window decide karta kitne tokens (toh kitne vectors) ek saath. RAG mein document ko CHUNK karke embed - context limit ki wajah se."},{"to":"hallucinations","conn":"similarity-signal -> confident-wrong","q":"Embedding similarity ko over-trust karne se kya galat ho sakta?","a":"Similarity 'shaayad same' deta (signal, proof nahi). Blindly maan lo -> galat merge/answer confidently (fluent fabrication). Counter = code validate (GST), human approve. 'AI proposes, code validates, human approves.'"}],"doubts":[{"q":"Map kaunsa hai? Ye map kya cheez hai?","a":"Map = sirf samajhne ka metaphor, real cheez nahi. Asli = har word ka vector (numbers). 'Paas baithna' = numbers ka similar hona. Vectors asli mein vector DB (Supabase/pgvector) mein store hote, koi 'map' nahi."},{"q":"Vector corpus mein hoti hai jo training time model read karta?","a":"NAHI. Corpus = raw training text (vocab+matrix banane ko, ek baar). Vector embedding matrix (lookup table ID->vector) mein, corpus se alag. Prompt pe model corpus nahi - frozen vocab+matrix use karta."},{"q":"Sab words ke vector mein numbers count same? Key-value pairs?","a":"Count SAME - ek model ke andar har vector exactly utne numbers (768/1024/1536). Values alag, count nahi. Key-value NAHI - plain numbers ki fixed-length line, koi label nahi."},{"q":"Vector length hamesha 768 hoti hai?","a":"Nahi - length MODEL chunta (384/768/1536). 768 sirf example tha. Fixed yeh: ek model ke andar sab vectors same length."},{"q":"Vector nikalta kaise hai - mujhe derive karna chahiye?","a":"Random init -> corpus se iterations mein learned (formula nahi). Tujhe derive/train NAHI - pre-trained API call. Ceiling = explain+use, not derive."},{"q":"Cosine value same/unrelated/opposite pe kya? (3 baar flip hui)","a":"+1 = same (MAX), 0 = unrelated, -1 = opposite. Range -1 se +1. (4 baar flip hui - ab LOCKED via ANGLE-anchor: cos 0deg = 1 = max = same; +1 hamesha MAXIMUM = maximum similarity.)"},{"q":"Pakka nahi hota to embedding use hi kyun?","a":"Alternative = exact match (===) jo near-duplicates ('Aristo' vs 'Aristo Eco', extra space, case) MISS karta. Embedding 'shaayad same' deta - === ke 'pakka false' se behtar. 60% -> 95%. 'Pakka nahi' != 'bekaar'."},{"q":"Har baar user ko approve karna padega?","a":"Nahi - FUNNEL: embedding 2397->30 candidates (auto), code 30->27 GST-confirmed + 3 unsure (auto), human sirf 3 dekhta. 95% machine, 5% human."},{"q":"ANN circular - 'paas wale' jaanne ko cosine chahiye, par ANN cosine se pehle kaise jaanta?","a":"INDEX. ANN do time pe: index-time (ek baar, search se pehle) saare vectors cells/groups mein baant deta; search-time query ko sirf few CENTERS se compare (pura DB nahi) -> cell mila -> us cell mein cosine. 'Paas wale' = index mein pehle se baithe."},{"q":"Cells kis basis pe? Representative center kaise nikalta?","a":"Center = bunch ki AVERAGE position. k-means: random centers -> har vector nearest center assign -> center ko group ki average pe move -> repeat jab tak settle. Cell criteria = nearest center. [CEILING: DB ka kaam, trace NAHI - bas 'centers = bunch ke middle, har vector nazdeeki center ke cell' kaafi.]"},{"q":"IVF aur HNSW - kacha samajh, kitni depth?","a":"Ceiling = explain+defend+use (65-70% = 100% requirement, deep MAT ja). IVF = cells/nearest-cell. HNSW = dost-ka-dost graph + hierarchical layers (highway->local). Internals DB karta. FinOps = HNSW (best recall, data chhota); industry default = HNSW; IVF/PQ jab arबों vectors + memory tight. Clarity build pe (CREATE INDEX hnsw)."},{"q":"pgvector kya, index kya, ANN khud banana?","a":"pgvector = Postgres add-on jo vector store+search deta (Supabase ke ANDAR). Index = pehle se organized arrangement -> search tez (kitab ka index jaisa). ANN khud NAHI banana - index toggle on, pgvector internally ANN karta. Sub-second = <1s (50-200ms)."},{"q":"[RESOLVED 21 Jun] ANN cold-recall - 4 din pehle nervous, ab?","a":"RESOLVED via Jirah: ANN cold-FLUENT. Sheher-mohalla-centroid + DO-PHASE (index-build once / search subset) + approximate-why-safe (HNSW recall 95-99% + GST funnel) + 'AI assistant not decision-maker' - sab khud ek saans mein bola. axis-h cracked -> held."},{"q":"Ek vendor naam ke kitne vector - per-subword ya ek?","a":"EK pooled vector. API saare token-vectors ko combine karke ek final vector deta. 'Aristo Eco Packaging' = ek vector, teen nahi. 2397 naam = 2397 vectors. (Yeh late surface hua - originally per-token socha tha; Claude ne bhi late introduce kiya = real miss.)"},{"q":"Pooling kaise karta - samajhna hai?","a":"NAHI - model-internal (backprop/attention category, V8-internals ka equivalent), ceiling se bahar. Bas: input string -> ek 'smart average'/pooled vector. WHAT it does, not HOW."},{"q":"Static vs contextual embedding kya?","a":"Static = ek word = ek FIXED vector, context-blind, polysemy pe tootta. Contextual = pura sentence padh ke har token ko padosi-shabdon se adjust -> same word alag context = alag vector. Tu contextual use karega. (Ulta pair = static vs contextual, NOT semantic vs contextual.)"},{"q":"Polysemy kya?","a":"Ek word, multiple meanings. 'bank' = nadi-kinaara YA paisa; 'bat' = jaanwar YA cricket-bat. Ek spelling, alag matlab. Static embedding isi pe tootta (dono ko same vector)."},{"q":"Pure prompt ka EK pooled vector banta - phir static/contextual ka farak kahan baithta?","a":"Do alag LEVEL: 'ek naam = ek pooled vector' (COUNT) vs 'static/contextual' (QUALITY - pooling se PEHLE har token-vector ne context dekha ya nahi). Static = context-blind fixed tokens pool; contextual = har token padosi se adjust HOKE pool. Dono pool karte - farak pre-pooling context ka. (Brilliant self-catch.)"},{"q":"Static relationship nahi nikalti, contextual nikalti?","a":"Sahi instinct: static har token AKELA (context-blind) vector deta; contextual token ko PADOSI-shabdon ke saath dekh ke vector. Contextual padosi-context 'relationship' use karta, static nahi."},{"q":"Semantic embedding kya - teesra type?","a":"Nahi teesra type. 'Semantic' = ADJECTIVE (meaning capture karta, spelling nahi). Static AUR contextual dono semantic. Type = static/contextual; semantic = unka quality (jo dono mein)."},{"q":"Cosine aur semantic embedding ek cheez?","a":"NAHI. Embedding/semantic = vector BANANA (meaning -> vector). Cosine = vectors COMPARE (number). Sequence, ek ke baad ek: pehle embedding (vector), phir cosine (similarity)."},{"q":"Yeh semantic SEARCH hai?","a":"Haan: prompt -> embed (vector) -> ANN index se nearest -> cosine -> matching results. 'Semantic' = MEANING se dhoondhna (keyword nahi). 'eco lab' vs 'eco labb' keyword miss, semantic pakad leta. RAG ka dil (Sprint 5)."},{"q":"Embedding vs cosine - kaun proximity deta?","a":"Embedding pooled VECTOR deta; proximity COSINE batata. 'Embedding proximity deta' mat bol - do alag steps."},{"q":"High-dimensional vector space kya - yaad rakhna padega?","a":"Yaad NAHI - DERIVE: vector = list of numbers (384), 384 numbers = 384-D space mein ek point. 3D se aage picture nahi, par distance/angle math se chalte, similar paas. Interview word = 'high-dimensional vector space' ('imaginary' mat bol)."},{"q":"Centroid ka apna vector hota - pooled hai ya nahi?","a":"Centroid = vector HAI, par cluster ke saare vectors ki AVERAGE position (synthetic point). Kisi ek vendor ka pooled vector NAHI."},{"q":"k-means ya 'k-steps'?","a":"Naam = k-MEANS (k-steps nahi). k = kitne clusters, means = average se centroid move. 4-step: random centroids -> nearest assign -> centroid ko average pe move -> repeat till settle. (Interview = 4-step intuition; convergence-math NAHI.)"},{"q":"Indexing embedding ka part hai kya?","a":"NAHI - alag layer. Embedding = vector banana (yahin khatam). Indexing = banaye vectors ko fast-search ke liye ORGANIZE (ANN). Speed ka kaam, embedding ka nahi."},{"q":"Indexing polysemy fix hai kya?","a":"NAHI - indexing = SPEED problem (fast search); polysemy = MEANING problem -> fix = CONTEXTUAL embedding. Do alag duniya."},{"q":"Threshold kaise pata + sahi rakhi ya nahi pata kaise chale?","a":"MEASURE, guess nahi. Golden dataset (~30 labelled pairs) pe har threshold try -> precision/recall/F1 se best chuno. Senior signal (junior hard-code karta). Sprint 3 hands-on aayega."},{"q":"Cosine kyun, sin/tan nahi?","a":"Direction match: same direction = 0deg, cos(0)=1 = MAX (perfect for similarity). sin(0)=0 (ulta), tan unbounded (blow-up). Cosine -1 se +1 bounded + similar pe max. (Detail = ceiling se bahar - 'cosine behaviour similarity ke liye perfect' kaafi, sin/tan graph mat khodo.)"},{"q":"Code se hi check karna hai to AI/embedding kyun lagao?","a":"AI assistant, final decision-maker nahi. AI candidates ko ~30 tak narrow (recall); code-only 10 lakh sab check -> DSA optimize karna padta. AI narrow karta, code (GST) confirm. AI = recall, code = precision."},{"q":"HNSW 'optimal' deta to uske baad code kyun jab HNSW khud accha hai?","a":"HNSW aur code DO ALAG SAWAAL: HNSW 'meaning mein paas?' (retrieval); code/GST 'legally same entity?' (verification). HNSW approximate bhi hai (recall 95-99%, optimal nahi), par perfect retriever BHI identity confirm nahi karta - 2 alag naam = 1 company (false +ve), 1 vendor alag strings (false -ve). GST = authoritative identity key."},{"q":"Images pe embedding - FinOps mein seekhunga kya?","a":"Yeh TEXT-embedding (vendor naam) - images pe nahi. Scanned/photo invoice = VISION/multimodal (Sprint 2, alag concept). Corpus = TEXT only (web pages, books, code) - webhook/image NAHI (webhook = alag programming cheez, word-mixup tha)."},{"q":"Embedding-indexing sirf duplicate ke liye use hota industry mein?","a":"NAHI - general vector-search tool: semantic search, RAG (Sprint 5, bada use), recommendations, image search. Vendor-dedup = ek application; RAG = bada. Ek baar samjha = RAG aadha samjha."},{"q":"Contextual embedding mechanism samajhna zaroori?","a":"NAHI - internal (attention/transformer category), park. Bas: model sentence padhta, padosi-shabdon se meaning decide, context-specific vector deta. WHAT, not HOW."}],"calibration":"4-din arc (19->21 Jun): samjha (axis-h cracked, Jirah DEFERRED - thread lamba + fried) -> aaj 9/9 Jirah SURVIVE -> tempered. PREDICTED-vs-ACTUAL: Nikhil ne start pe 'ANN bhool gaya, sardard' bola = predicted LOW (axis-h). ACTUAL: poora axis-h COLD-FLUENT khud bola (sheher-mohalla-centroid, do-phase, approximate-why-safe, AI-assistant defend). Gap = decay/freshness (4-din gap + Jirah-defer), comprehension NAHI - Re-Jirah weld karega. CRACKS WELDED today: (1) cosine range 4th flip -> LOCKED via angle-anchor (cos 0deg=1=max=same); (2) axis-h ANN cracked->held; (3) UNKNOWN-UNKNOWN surfaced+welded - per-token vs whole-name POOLED vector (ek naam = ek vector) - yeh LATE nikla via 'kuch miss kiya?', JIRAH-FIRST hota to pehle pakda jaata = LESSON: Jirah defer mat karo, woh gap-catcher hai; (4) static-vs-contextual at POOLING level (count vs quality - brilliant self-catch); (5) semantic THREE-NAME anchor (type vs adjective; semantic != cosine; semantic != teesra type); (6) embedding-vs-cosine FINAL separation (proximity = cosine, embedding nahi). CLAUDE-SIDE honesty: pooled-vector piece MAINE late introduce kiya (real miss, Jirah-first se bachta); '768' pehle fixed bola (example tha); cost mein API-vs-DB churn. Nikhil ne khud ceiling-boundaries pakdi (pooling-internals, contextual-mechanism, k-means-math, HNSW-graph, sin/tan, junior-scope-creep rok) = senior signal. FRESHNESS: FRESH lock - Re-Jirah day-3 (24 Jun) PENDING. SENIOR-ADD for next Re-Jirah: axis-i skeptic mein polysemy + 'similarity = signal-not-proof' bhi (aaj scale-only tha).","buildHook":"FinOps duplicate-vendor detection: 2397 naam -> embed (OpenAI text-embedding-3-small, 384, contextual) -> EK pooled vector/naam -> pgvector (Supabase) + HNSW index (CREATE INDEX ... USING hnsw) -> query 'Aristo' -> ANN search (centroids -> cluster, sub-second) -> cosine proximity -> threshold (golden-dataset tuned) se upar = CANDIDATE -> CODE (GST exact) confirm -> human edge cases. Defend: 'embedding candidates (recall), GST final identity (precision); chhota model naam simple (1-layer); HNSW best recall; AI assistant not decision-maker.' DEMO_MODE caching, api_logs cost (90% spend extraction LLM pe; embedding/DB negligible; cosine = compute not tokens). BIGGER USE: same embedding+ANN machinery = RAG (Sprint 5, 'pichli baar Noida kaise allocate kiya?').","interviewLines":["Embeddings turn token IDs into learned meaning-vectors where similar items sit close - I call a pre-trained API, I don't train them.","I use cosine similarity, not Euclidean - cosine measures direction and ignores magnitude, so a long and a short text with the same meaning still score ~+1.","Static embeddings break on polysemy (bank = river vs money) - I use contextual embeddings, where the same word gets a different vector per context.","Embedding similarity is a signal, not proof - it surfaces maybe-same candidates; my code confirms with an exact GST match. AI gives recall, code gives precision.","Brute-force similarity is O(n^2) and dies at scale - I use pgvector's HNSW index for sub-second approximate nearest-neighbor search.","Vector dimension is a complexity decision, not an importance one - vendor names are simple, so 384 dims; legal docs would warrant larger.","HNSW finds the closest vectors fast, but closeness is a similarity signal, not proof of identity - two different vendors can have near-identical names, and the same vendor can appear with very different strings. GST is the legal ground-truth, so HNSW does retrieval and code does verification - they answer different questions.","A vendor name returns a single pooled vector for the whole string, not one per token - so 2,397 names give 2,397 vectors to index and search.","I don't guess the similarity threshold - I tune it against a labelled golden set and measure precision and recall. Hard-coding it is a junior move.","Semantic search means retrieving by meaning, not keywords - 'eco lab' and 'eco labb' miss on exact match but land close in embedding space, and it's the same machinery RAG runs on."],"bolo":"Embedding basically tokenization se mili random ID (jiska doosri ID se koi rishta nahi) ka ek meaning-vector nikalna, jahan similar words ke vectors paas baithte. Practical mein ek pure vendor naam ke saare token-vectors model COMBINE/pool karke EK final vector deta - 'Aristo Eco' = ek vector, teen nahi. Do type: static (purana, context-blind - ek word ka ek fixed vector, isliye 'bank' nadi/paisa dono ko same -> polysemy pe tootta) aur contextual (model pura sentence padh ke har token ko aas-paas ke shabdon se samajh ke pool karta -> same word alag context = alag vector). Dono semantic (meaning capture karte) - main contextual + pre-trained API (OpenAI) use karunga, khud train nahi. Phir do vectors kitne similar = cosine ANGLE se: cos 0deg = +1 same, 90deg = 0 unrelated, 180deg = -1 opposite (Euclidean length pe dhokha khaata - same meaning ka chhota/lamba vector door bol deta - isliye cosine jo direction dekhta). Similarity 'shaayad same' deta, pakka nahi - isliye threshold (golden-dataset se tuned) se upar = candidate -> code GST se exact confirm -> human edge case. 'AI assistant hai, final decision-maker nahi.' Vector chhota/bada task ki COMPLEXITY se (naam simple = 384). Aur duplicate dhoondhne mein har vector se cosine (brute-force) 10 lakh pe slow -> ANN/index: pehle k-means se clusters (har cluster ka centroid = average-position vector), search mein query ko pehle centroids se cosine -> nearest cluster -> us cluster ke andar cosine -> sub-second. pgvector mein CREATE INDEX USING hnsw, approximate par recall 95-99% + GST waise bhi confirm.","bolo_by":"- Nikhil, Jirah-tested 9/9 (FRESH - Re-Jirah day-3 = 24 Jun pending)","viz":"","deep":"### HOOK (business cliffhanger — definition nahi)\nDo invoice rows saamne: **`Aristo`** aur **`Aristo Eco — ₹81,500`**. Tu insaan hai, tu jaanta hai **same\nvendor hai.** Par computer ke liye `\"Aristo\" === \"Aristo Eco\"` → **false.** Aur tokenization ne to in dono\nko **random IDs** (maan le 4823, 7891) de diye — in do numbers ke beech \"same vendor\" ka **rishta kahan se\naaye?** Yahin pe embeddings aata hai, aur yahin tera **₹81 crore duplicate-detection** ka asli engine hai.\n\n### MECHANISM (ek saans mein)\nTokenization se mili ID **random** hai (koi meaning nahi). Embedding us ID ko ek **meaning-vector**\n(sau-do-sau numbers ki list) deta hai, jahan **similar meaning wale words ke vectors paas baithte hain.**\nEk pure input string (vendor naam) ke saare token-vectors model **POOL** karke **EK final vector** deta —\nnaam = ek vector. Phir do vectors kitne paas hain = **cosine** (alag step). Aur bade DB pe fast dhoondhne ke\nliye **ANN index (HNSW)**.\n\n### THE ONE PICTURE (yeh diagram poore concept ki reed hai)\n```\n\"Aristo Eco Packaging\"\n   │\n   ▼  tokenization → subwords + token IDs        ← yeh tu pehle se jaanta tha (sahi)\n   │     [\"Ar\",\"isto\",\" Eco\",\" Pack\",\"aging\"] → [4823, 901, 5567, 88, 142]\n   ▼  embedding matrix → har token ka vector      ← foundations: ID → vector lookup\n   │     4823→[..], 901→[..], 5567→[..], ...\n   ▼  model POOL/combine karta → EK final vector  ← YEH PIECE tu miss kar raha tha\n   │     = [0.2, -0.5, 0.9, ... 0.8]   (384 numbers)\n   ▼  pgvector (Supabase) mein store\n   │     [2,397 vendor naam → 2,397 vectors]\n   ▼  CREATE INDEX ... USING hnsw                 ← ANN index in 2,397 vectors pe\n```\n**Ek naam → ek vector.** Tokens ek **transient intermediate step** hain (ek final vector banane ke liye);\nindex **tokens pe nahi, in 2,397 final per-naam vectors pe** banta hai.\n\n---"},{"id":"inference","num":"03","lockedOn":"2026-06-24","reJirahDone":[],"stream":"foundations","title":"Inference & Sampling","status":"tempered","dot":"magenta","source":"Karpathy foundations stream + FinOps temp=0 extraction + 9-axis Jirah across 5 sessions (23-24 Jun)","why":"Inference = har LLM ka actual run-step (ChatGPT/Claude/FinOps sab ispe chalte). Interview-guaranteed: deterministic vs sampling, temperature/top-k/top-p, output-cost & KV cache, streaming. FinOps mein temp=0 extraction + 'AI proposes code validates' decision = senior differentiator. Bucket 2 ka engine.","hook":"Tera FinOps tool 'Aristo Eco - Rs81,500' invoice ko JSON mein nikaal raha - har token jo AI BANATA hai uska paisa (output 3-5x input). Par har step pe model ke saamne ek jawab nahi, poori vocab (~1 lakh) pe ek probability-MENU hota, aur usme se ek UTHANA hota. Yeh 'uthana' deterministic ya creative - yahi decide karta tera extraction auditable rahega ya buggy, aur bill kitna aayega.","mechanism":"Trained model ek token at a time, loop mein chalta. Har step: neural-net -> logits (raw scores) -> softmax -> % menu -> temperature (sharp/flat) -> top-k/top-p (trim) -> pick (greedy/weighted) -> append -> loop. Menu BANANA = model (training-baked weights); menu se UTHANA = developer knobs. Extraction pe temp=0 (consistency, accuracy nahi). Cost output + context-length pe (sequential decode-passes + KV cache size), input pe nahi.","faultLines":[{"axis":"a","title":"Kya hai + analogy","strike":"Inference exactly kya hai? Har step pe model kya banata hai - ek word, ya kuch aur? Training se kaise alag?","weld":"Inference = trained model ka actual CHALNA - ek token at a time, loop mein (pura jawab ek saath nahi). Har step pe model poori vocab (~1 lakh) pe ek %-MENU/scoreboard banata (single word nahi). Phone-autocomplete jaisa - har step suggestions with likelihood. Example: 'Invoice from Aristo' -> Eco 60% / Pharma 15% / Ltd 9%. Token pick -> append -> dobara menu -> loop. Training (seekhna, weights set) != inference (frozen weights se chalna). [Stuck: over-narrow 'sirf FinOps' -> Jirah ne kHOla yeh har LLM ka run-step, FinOps ek application.]","status":"held","deep":"**SAWAL:** *\"Inference exactly kya hai? Har step pe model kya banata hai — ek poora jawab, ek word, ya kuch aur? Aur training se yeh kaise alag hai?\"*\n\n**POORA JAWAB:**\n- **Inference = trained model ka actual CHALNA** — ek baar mein **ek token**, ek **loop** mein. Pura jawab ek saath nahi banta; ek-ek token karke banta, har naya token purane ke baad.\n- **Har step pe model ek MENU/SCOREBOARD banata** — poori vocab (~1 lakh words) pe har word ka ek **%** (kitna likely yeh next aaye). Ek single word nahi —  pura probability-menu.\n- **Analogy (phone autocomplete):** tu type karta \"I am going to the…\" — phone neeche 3-4 suggestions deta, har ek alag likelihood pe. Model bhi waise hi har step pe pura menu banata, phir ek uthata.\n- **Example:** context \"Invoice from Aristo…\" → menu: `Eco 60%`, `Pharma 15%`, `Ltd 9%`, … baaki bikhre. Model is menu mein se ek pick karta, append karta, phir agle token ke liye dobara menu banata.\n- **Training ≠ inference.** Training = model ka **seekhna** (weights set hote). Inference = un **frozen weights** se model ka **chalna** (output dena). Do alag phase.\n\n**JAHAN TU ATKA → WELD:** Shuru mein tu ne inference/temperature ko **sirf FinOps ke liye** socha (\"yeh concepts bas mere invoice extraction ke liye hain\"). → **Over-narrow.** Jirah ne khola: yeh **har LLM ka run-step** hai — ChatGPT, Claude, tera FinOps, sab inference pe chalte. FinOps sirf **ek application** hai, concept fundamental hai. → **Bol: \"inference is how any LLM generates - FinOps is just one use of it.\"**\n\n**TERA BOLO (verbatim, sacred — tere exact shabd):**\nkya ye inference hain jo hum learn kr rahe hain?? logit, top-k top-p temprature ye chaaro issi ke parts hain?\n\n**INTERVIEW LINE:** *\"Inference is the trained model running - one token at a time, in a loop. At each step it builds a probability distribution over the entire vocabulary and samples one token; it's not retrieving a stored answer, it's generating.\"*"},{"axis":"b","title":"Sampling kyun (greedy vs sampling)","strike":"Menu ban gaya - har word ka %. Usme se pick kaise? Hamesha #1 kyun nahi?","weld":"Greedy = hamesha #1 % pick -> deterministic (same in = same out) par repetitive/robotic. Sampling = weighted dice (loaded pasa) -> jiska % zyada uska chance zyada, par #2/#3 ko bhi mauka -> controllable diversity (natural output). Dono chahiye: extraction = determinism, chat/creative = variety. Isliye pick-strategy ek knob hai, fixed nahi.","status":"held","deep":"**SAWAL:** *\"Menu ban gaya — har word ka %. Ab usme se pick kaise karein? Hamesha sabse upar wala (#1) kyun nahi utha lete?\"*\n\n**POORA JAWAB:**\n- **Greedy = hamesha #1 % wala token utha lo.** Deterministic (same input → same output har baar), par **repetitive/robotic** — model ek hi safe raaste pe atak jaata, variety zero.\n- **Sampling = weighted dice (loaded pasa) phenko.** Jiska % zyada uske aane ka chance zyada, par #2/#3 ko bhi mauka. → **controllable diversity** (creative, natural-lagta output).\n- **Kyun dono chahiye:** kuch kaam pe determinism chahiye (extraction — same JSON), kuch pe variety (marketing copy, chat). Isliye **pick-strategy ek knob hai**, fixed nahi.\n\n**INTERVIEW LINE:** *\"Greedy always takes the top token - deterministic but repetitive. Sampling rolls a weighted die over the distribution - it trades reproducibility for controllable diversity, and which you want depends on the task.\"*"},{"axis":"c","title":"Mechanism NAMED (full pipeline)","strike":"Poori inference pipeline NAME kar - logit, softmax, temperature, top-k, top-p, sampling - kis order mein, kaun kya karta?","weld":"(1) neural-net -> LOGITS (raw) (2) SOFTMAX -> % menu (3) SAMPLING stage: TEMPERATURE (shape) -> TOP-K/TOP-P (trim) -> PICK (greedy/weighted) (4) APPEND (5) LOOP. KEY: menu BANANA = model (training-baked weights, dev ka control nahi); menu se UTHANA (sampling) = developer knobs (temp/top-k/top-p). Yahi line interview gold.","status":"held","deep":"**SAWAL:** *\"Poori inference pipeline NAME kar — logit, softmax, temperature, top-k, top-p, sampling — ye sab kis order mein, aur konsa kaam kaun karta?\"*\n\n**POORA JAWAB (pipeline, ek saans):**\n1. **Neural network → LOGITS** (har vocab-word ka raw score, abhi % nahi).\n2. **SOFTMAX → %** ka menu/scoreboard (sum = 100%).\n3. **SAMPLING stage** (3 sub-steps):\n   - **TEMPERATURE** → menu ko sharp/flat reshape karta.\n   - **TOP-K / TOP-P** → menu ko trim karta (faltu tail kaat deta).\n   - **PICK** → ek token (greedy ya weighted-random).\n4. **APPEND** → token sequence ke aage jud jaata.\n5. **LOOP** → agle token ke liye step 1 se dobara.\n\n**KEY distinction:** **menu BANANA = model ka kaam** (training-baked weights se) — ispe developer ka control nahi. **Menu se UTHANA (sampling) = developer ke knobs** (temperature/top-k/top-p). Yahi line interview mein gold hai.\n\n**INTERVIEW LINE:** *\"The network emits logits, softmax turns them into a probability menu, then the sampling stage - temperature, top-k/top-p, and the pick - selects a token, which is appended and the loop repeats. The model bakes the menu; the developer only controls the pick.\"*"},{"axis":"d","title":"Math (softmax + temperature)","strike":"Softmax formula bol, temperature usme kahan. Phir T=0.5 aur T=2 ka worked example.","weld":"Softmax = e^(score)/sum(e^scores) [divide BAHAR, sum e^scores ka - raw ka nahi]. Temperature = e^(score/T) [softmax ke ANDAR, e^ se pehle]. Worked (3.0/1.6/1.1): e^=20.1/5.0/3.0, sum 28.1 -> 71/18/11%. T=0.5 scores double -> Eco 92% (sharp); T=2 half -> Eco 54% (flat); T=0 -> infinity -> #1=100% greedy. [Stuck: softmax-divide (individual/sum-of-all-e); temp = INPUT/knob not output.]","status":"held","deep":"**SAWAL:** *\"Softmax ka formula bol, aur temperature usme kahan ghusti hai. Phir T=0.5 aur T=2 pe ek worked example chala ke dikha.\"*\n\n**POORA JAWAB:**\n\n**Softmax** (raw logit → %):\n- (1) har logit ka **e^(score)** nikaalo\n- (2) saare **add** karo (sum)\n- (3) har **e^(score)** ko us **SUM** se **divide** karo → %\n- formula: **e^(score) / Σ(e^(scores))** — divide **bahar** hota (e ke andar nahi), aur sum **e^scores** ka hai (raw scores ka nahi).\n\n**Temperature** (softmax ke ANDAR, e^ se pehle):\n- formula: **e^(score / T)** — har logit ko pehle **T se divide**, phir e, phir softmax.\n\n**Worked example** (3 tokens, scores 3.0 / 1.6 / 1.1):\n- e^3.0 = 20.1, e^1.6 = 5.0, e^1.1 = 3.0 → sum = 28.1 → **Eco 71% / Pharma 18% / Ltd 11%**.\n- **T = 0.5** (scores double: 3.0→6.0, 1.6→3.2, 1.1→2.2) → **Eco ~92%** — menu **SHARP**.\n- **T = 2** (scores half: 3.0→1.5, …) → **Eco ~54%** — menu **FLAT**.\n- **T = 0** → e^(score/0) → infinity → #1 ko 100%, baaki 0 → **greedy / deterministic**.\n\n**JAHAN TU ATKA → WELD (2 cracks):**\n1. **Softmax divide** — tu ek baar uljha \"kya divide karein?\" → **har individual e^score ko SAB e^scores ke SUM se** (raw scores ke sum se NAHI).\n2. **Temperature = INPUT/knob, output nahi** — yeh menu banne se **pehle** logit ko reshape karti; koi output-number nahi deti.\n\n**TERA BOLO (verbatim, sacred — tere exact shabd):**\n\n[softmax recite]\nSoftMax se hum compute krte hain % by using this: 1. calculate e^(logit score of each word) 2. add all of the values 3. now divide each value found by step 1 by step 2 to get each individual logit score in %\n\n[temperature formula]\ntemp formula is e^(individual logit score/T) = kuch value, aaise hi sab logits ki value nikalo and unka sum kro, last mein har e^(individual logit score/T) ko total sum se divide krdo\n\n[final blind-recall, Session 5]\ncompute karte hain usko [e]^(logit value of each individual token), sab values ka sum nikal lo, ab har individual ki % nikalne ke lie 1 step ki value ko 2 step ki value se divide krdo... temprature nikalne ke lie e^(logit value of each indvidual/T), sab values ka sum karo, ab... 1 step ki value ko 2 step ki value se divide kardo\n\n**INTERVIEW LINE:** *\"Softmax is e^score over the sum of all e^scores; temperature divides each score by T inside the exponent before softmax - low T sharpens the distribution toward greedy, high T flattens it, and T=0 is pure argmax.\"*"},{"axis":"e","title":"Failure modes / limits (3)","strike":"Inference kab TOOTTA hai? Kitne distinct failure modes - har ka mechanism?","weld":"3 modes: (1) temp too high -> flat menu -> garbage% upar -> pick -> sentence-repeat -> next bhi garbage -> snowball -> incoherent. (2) temp 0/greedy + pause -> repetition loop ('the the the'), self-reinforcing - SIRF long free-form gen, extraction mein NAHI. (3) menu khud galat (bad logits) -> koi temp fix nahi karta (upstream) -> code validate. Record-player needle analogy. [Stuck: 4 cracks in first Bolo (logits word, garbage%-ulta, snowball, teesra mode) -> self-patched.]","status":"held","deep":"**SAWAL:** *\"Inference kab TOOTTA hai? Kitne distinct failure modes hain — har ek ka mechanism bol.\"*\n\n**POORA JAWAB (3 failure modes):**\n1. **Temperature too high** → menu **flat** → garbage-tail tokens ki **% upar** → koi garbage pick ho gaya → model pura sentence dobara dekhta → **next bhi garbage** → **snowball** → incoherent output.\n2. **Temperature 0 / greedy + pause** → **repetition loop** (\"the the the…\") → self-reinforcing (model wahi safe token baar-baar). **CRITICAL:** yeh sirf **lambi free-form generation** mein, **extraction mein NAHI** (waha output controlled).\n3. **Menu khud GALAT** (bad logits) → model ne data hi galat padha → **koi bhi temperature isse fix nahi karega** (problem **upstream**, logit-banane mein) → isliye **code validate karta**.\n\n**Analogy (record-player needle):** ek baar needle galat groove mein gir gayi (garbage/loop) → wahi ghisa-pita raasta repeat. Thoda randomness needle ko nikaal sakta, par bahut randomness = poora shor.\n\n**JAHAN TU ATKA → WELD:** Pehle Bolo mein **4 cracks** the (library mein voice theek record nahi hui) — \"logics\" word, garbage%-ka-ulta, snowball miss, teesra mode adhoora. Tu ne khud patch kiya: yes **logits**; high temp → garbage **% upar** (zyada chance); ek garbage → next bhi garbage (sentence-repeat); aur teesra mode = **menu galat banna, temp se bahar**.\n\n**TERA BOLO (verbatim, sacred — tere exact shabd):**\n\n[pehla recall, Session 2]\nOpus, all hear me! So basically what you're saying is that inference breaks when basically there are three cases when inference can break: first case is when the temperature is too high. If the temperature like every model when it is creating, uh, when it's creating that, uh, what was that word? I forgot the word. One second. Uh, logics. So every model, when logics have been created, if the temperature is too high, every logits has a garbage tail, but it has garbage in the lower temperature. It's too high. That means the the percentage score of the garbage lodges would be very high. But there are a lot of chances that that will be picked up. Right? But if the if the temperature is too low and we... and there is a pause in the in the prompt, the words are repeated. That is just two times the words are repeated, and the temperature is set to zero. So according to course of the model, we'll just look at the two words and the temperature is zero. So there is no scope of being creative for the model. So it will be stuck in the loop. Right? And the third failure model is... and the third failure model is that if if if while creating the logits, it it has... it it it read the data incorrectly. So in that case, no matter what temperature you set, it... the the the reply from the model will be wrong because temprature is just about retriving the top %score word and the logits were created in the wrong manner while reading the data\n\n[patch, Session 2]\nbhai library mein betha hu na to sahi se record nahi hui hain voice, yes it is logits, yes high tempreature pe garbage words ki %score high ho jati hain that means more chances of getting it in the response, har word bolne ke baad model pura sentence dobara repeat krta hain to agar garbage pick hogya to very high chance ki next word bi garbage hi pick hoga\ntemp accuracy nahi deta, temp sirf next word kya aaega from model in the response vo deta hain, accuracy ke lie pydantic+maths+human use hote hain\n\n**INTERVIEW LINE:** *\"Three ways inference breaks: temperature too high flattens the menu and garbage gets sampled and snowballs; greedy/low-temp can loop on repetition in long generation; or the logits themselves are wrong upstream, which no temperature fixes - that's why code validates the output.\"*"},{"axis":"f","title":"Tradeoffs (temp vs top-k vs top-p + order)","strike":"Temperature vs top-k vs top-p - kaam aur EXACT order. Rozmarra ka knob kaunsa, defaults kaunse?","weld":"ORDER: logits -> softmax -> TEMPERATURE (shape) -> TOP-K/TOP-P (trim) -> PICK. Temperature = 90% knob (fixed->0, flow->0.3-0.7, variety->0.8+); kam=SHARP (garbage% neeche), zyada=FLAT (garbage% upar). Top-k = fixed-count cutoff (high-temp garbage safety-net; k=1=greedy). Top-p = adaptive cumulative-% cutoff (France->~1 word, hobby->~50 words, same p). Greedy/weighted = temperature ka NATIJA, alag toggle nahi. Practical: ~95% sirf temperature; top-k/p defaults pe. [Stuck: order slip; sharp/flat LABEL-SWAP - khud pakda.]","status":"held","deep":"**SAWAL:** *\"Temperature vs top-k vs top-p — teeno ka kaam, aur EXACT ORDER bol. Kaunsa rozmarra ka knob hai, kaunse defaults pe chhod dete?\"*\n\n**POORA JAWAB:**\n\n**ORDER:** logits → softmax (%) → **TEMPERATURE** (menu shape) → **TOP-K / TOP-P** (menu trim) → **PICK**.\n\n- **TEMPERATURE = 90% wala knob.** Fixed/structured kaam → **0**; thoda flow → **0.3-0.7**; variety/creative → **0.8+**.\n  - **kam temp → menu SHARP** (garbage tokens ki % NEECHE).\n  - **zyada temp → menu FLAT** (garbage tokens ki % UPAR).\n- **TOP-K = fixed-count cutoff.** Sirf top-k tokens rakho, baaki kaat do. High-temp pe garbage ke against **safety-net**. **k=1 → greedy** (hamesha #1).\n- **TOP-P (nucleus) = adaptive % cutoff.** Tokens tab tak rakho jab tak cumulative % ek threshold (e.g. 0.9) tak na pahunche. **Context se adapt:** \"France ki rajdhani?\" → ~1 word bachta (model confident); \"ek hobby batao?\" → ~50 words (open) — **same p**, alag menu-size.\n- **Greedy vs weighted-random = temperature ka NATIJA**, alag toggle nahi (T=0 greedy, T>0 weighted).\n- **Practical:** ~95% kaam **sirf temperature** se; top-k/top-p mostly **defaults** pe — sirf specific output-problem pe chhedo.\n\n**JAHAN TU ATKA → WELD (2 cracks):**\n1. **Order slip** — trim aur shape ka order uljha; lock: pehle **temperature shape**, phir **top-k/p trim**, phir **pick**.\n2. **Sharp/flat LABEL-SWAP** — tu ne pehle bola \"kam temp = broad menu\". GALAT. **kam temp = SHARP** (garbage% neeche); **zyada = FLAT** (garbage% upar). Tu ne khud pakda aur palta.\n\n**TERA BOLO (verbatim, sacred — tere exact shabd):**\n\n[full pipeline, Session 5]\n1- sabse pehle neural network se logit banao jo raw numbers deta hain -> softMax se usko % mein convert krke menu banao -> temprature set karke menu ko kitna flat ya broad karna hain vo decide karo [kam temprature pe broad menu hoga and menu mein jo garbage tokens hain unki %value kam ho jaegi, zyda temprature pe menu flat ho jaega and menu mein jo garbage tokens hain unki %value zyda ho jaegi] -> fir top-p ya top-k laga ke menu ko trim karo -> fir value pick karlo [ye pick karne ko hi sampling kehte hain] and iss puri process ko inference kehte hain\n2-top-p adaptive hain [iska matlab kya hua] -> temprature zyda pe use hota hain ya kam pe ye yaad nahi aaraha\n3- top-k kehta hain menu mein se sirf k=jo value developer ne set ki hui hain utne tokens hi pick kro apna reply ka word banate hue. agar temprature zero hain to k=1 hoga hamesha matlab top value hi pick hogi hamesha, high temprature pe menu mein garbage tokens ko trim krdega??\n\n[self-correction on sharp/flat, Session 5]\nkam temprature -> menu sharp matlab garbage values ki % value kam ho jati hain, high temprature pe flat menu matlab garbage value% uper ho jati hain\n\n**INTERVIEW LINE:** *\"Order is logits, softmax, temperature to shape, top-k or top-p to trim, then pick. Temperature is the 90% knob - low sharpens, high flattens; top-k caps a fixed count, top-p keeps a cumulative-probability mass so it adapts to context. In practice I mostly just move temperature.\"*"},{"axis":"g","title":"FinOps application (extraction temp=0)","strike":"Tere FinOps extraction mein temperature kya? Defend. Aur 'temp=0 = accurate' galat kyun?","weld":"Extraction -> temp=0: structured + correctness-critical; same invoice = same JSON (reproducible+auditable); sampling-variety = vendor-flip/number bug. CRITICAL: temp=0 = CONSISTENCY, NOT accuracy - galat logit (upstream) ko consistently repeat karega. Accuracy = Pydantic (shape) + business-maths (subtotal+GST=total, TDS) + confidence-gated human. 'AI proposes, code validates, human approves.' Code akela nahi (messy/varied layouts, 300-rules phir bhi crash). AI=accountant (padhta), code=calculator (jodta). [Senior signal: jahan AI creatively NAHI lagani.]","status":"held","deep":"**SAWAL:** *\"Tere FinOps invoice extraction mein temperature kya rakhega? Defend kar — aur agar koi kahe 'temp=0 means accurate' to kya bolega?\"*\n\n**POORA JAWAB:**\n- **Extraction → temperature = 0.** Kyun: **structured + correctness-critical** kaam; **same invoice → same JSON** har baar (reproducible + auditable); sampling-variety yaha **bug** hai (vendor-naam flip, number mismatch) — feature nahi.\n- **CRITICAL: temp=0 = CONSISTENCY, accuracy NAHI.** Agar AI ne data **galat padha** (bad logits, upstream), to temp=0 us galti ko **consistently repeat** karega — confident-wrong. → temp=0 ka matlab \"hamesha sahi\" nahi, \"hamesha **same**\" hai.\n- **Accuracy alag layer se aati:** **Pydantic** (shape/type) + **business-maths** (subtotal+GST=total, TDS govt-number) + **confidence-gated human-in-loop**.\n- **\"AI proposes, code validates, human approves.\"** Yeh core architecture line.\n- **Code se hi pura kyun nahi?** Code **messy, varied invoice layouts** read nahi kar sakta (300-rules likhni padti aur phir bhi naya format crash). AI **reading** mein best, code **validating/maths** mein best — dono apni strength.\n- **Analogy:** AI = accountant jo bill padh leta; code = calculator jo exact jodta. Accountant se calculator ka kaam mat karwao.\n\n**JAHAN TU ATKA → WELD:** Tu ne \"galat read + temp=0\" ka tradeoff theek pakda, par initially \"temp=0 = accurate\" ki taraf jhuka. Weld: **temp=0 sirf consistency; accuracy code+human se.** Galti **logit-banane** mein hoti, temperature se bahar.\n\n**TERA BOLO (verbatim, sacred — tere exact shabd):**\n\n[CEO register — Session 1]\nceo ko I will say ki temperature is basically ki AI apke data ya prompt pe jawab kitni creative freedom se dega? since we are dealing with financial data to hummein chahiye ekdum close to zero creativity from AI model, matlab jo cheez jaise aarahi hain user se usko vaise hi read kro and vaise hi exactly jawab do\n\n[senior register / tradeoff — Session 1]\nsenior ko kahunga ki tradeoff ye hain ki galat reading krli agar AI ne and agar humne temp 0 kia hua h to vo uss galat reading of data ke hisab se apne logit se answer dega islie code se validate krvana jaruri hain AI ka output. ab code se hi pura kyu na krva lia jaein vo islie hain ki code har user se added data files read nahi kr sakta because they can be in different different formats to AI does what it does best and code does what it does best which is validating\n\n[error-location — Session 1]\nagar AI model galat read krle to logits banana mein galti hoti hain, temp =0 sirf ye kehta hain pick the logit with highest % that means galat logit ko baar baar pick krna and we are not giving any creative freedom to AI model to think anything else since T=0\n\n**INTERVIEW LINE:** *\"For extraction I set temperature to 0 - it's structured, correctness-critical, and the same invoice must give the same JSON for auditability. But temperature=0 is consistency, not accuracy: if the logits are wrong it repeats the mistake reliably. Accuracy comes from Pydantic, business-math checks, and human-in-the-loop - AI proposes, code validates.\"*"},{"axis":"h","title":"Scale / cost (prefill-decode, KV, streaming, context)","strike":"Prefill vs decode? Output INPUT se 3-5x mehnga KYUN? KV cache role? Streaming fast? Lamba context mehnga kyun?","weld":"Prefill (input read, parallel single-pass, sasta) vs Decode (output, sequential, mehnga). Output 3-5x mehnga = har output token poora model ka EK sequential forward-pass, jitne output words utne passes - NOT KV-cache-size, NOT re-tokenization. KV cache = notebook of K/V (input+output, badalta nahi) -> reuse -> har pass sirf newest token compute, purane KV read (GPU) -> decode SASTA (cause nahi, solution); OFF -> quadratic; trade-off compute-vs-VRAM. Streaming = PERCEIVED latency only (total = TTFT + output x inter-token gap); actual same; pure UX. Lamba context mehnga - driver = SIZE (bada cache=VRAM + har step bada read=compute); solution RAG. KV = company GPU (VRAM), user RAM nahi; KV != embedding. [Layer-A=cache-what/cost (HELD); Layer-B=K/V internals/attention -> concept #4. THE #1 stuck->weld: output-cost driver 4x surface -> self-derived read-vs-pass -> sequential PASSES, KV ghatata hai.]","status":"held","deep":"**SAWAL:** *\"Scale aur cost. Prefill vs decode kya hai? Output INPUT se 3-5x mehnga KYUN? KV cache ka role? Streaming fast karta hai? Aur lamba context mehnga kyun?\"*\n\n**POORA JAWAB:**\n\n**Prefill vs Decode:**\n- **PREFILL = user ka input read karna.** Pura data ek saath mil jaata → model use **single parallel pass** mein read karta (tokenization+embedding parallel) → KV cache banata → **SASTA**.\n- **DECODE = output generate karna.** Ek-ek token, **sequential** → **MEHNGA**.\n\n**Output 3-5x mehnga KYUN (#1 deep weld):**\n- Har output token = **poora model ka EK sequential forward-pass**. **jitne output words, utne sequential passes** — ek-ke-baad-ek. **YEH driver hai, KV-cache-size NAHI, re-tokenization NAHI.**\n\n**KV cache (solution, cause nahi):**\n- Ek **notebook** of K/V notes — input + ab tak generate kiye output, dono ke. Yeh notes **kabhi badalte nahi** (ek baar bane) → **reuse** karo, recompute mat karo.\n- Isliye har pass mein model sirf **newest token** compute karta, purane tokens ki KV **read** kar leta (GPU se). → har pass **halka**, **par passes phir bhi sequential**. → KV cache output ko **SASTA** banata, mehnga nahi.\n- **OFF → quadratic** (1+2+…+N, har naya word se pehle saare purane dobara pass). Trade-off: **compute bachao vs GPU-VRAM kharcho.**\n\n**Streaming = PERCEIVED latency only:**\n- **Total = TTFT + (output tokens × inter-token gap).** Actual speed **same**; streaming sirf word-by-word **dikhata** → user ko wait/hang feel nahi hota. **Pure UX**, koi speedup nahi.\n\n**Lamba context mehnga — driver = SIZE:**\n- (a) bada KV cache → **GPU VRAM zyada**; (b) har step bada notebook **read** → **compute zyada**. Jaise-jaise chat badhti, har turn pe input + saare purane replies ki KV read → context-memory **bloat** → solution **RAG** (sirf relevant context bhejo).\n- **KV cache = COMPANY ke GPU (VRAM) pe** (Anthropic/OpenAI datacenter), **user ke RAM mein NAHI.** User sirf text bhejta/leta.\n- **KV cache ≠ embedding** (yeh attention ke K/V, neural-net internals — concept #4 mein khulega).\n\n**[LAYER split:** Layer-A = *cache kya/kahan, cost kya* (yeh ab, HELD). Layer-B = *K/V exactly bante kaise, attention math* → **concept #4 (Neural Net) pe defer**.]**\n\n**JAHAN TU ATKA → WELD (THE #1 story, 4 baar surface hua):** Output-cost ka asli driver **4 baar across sessions** uljha — \"KV-cache-size?\", \"re-tokenization?\", \"purane dobara read?\". Finally tu ne **khud read-vs-pass derive** kiya: KV cache nahi hota to har naya token banane se pehle **saare purane model se pass** karne padte; KV cache se **sirf newest token pass** hota, purane ki KV **read** hoti. → **Output mehnga = sequential PASSES (jitne output tokens), KV cache us cost ko GHATATA hai.** Permanently welded.\n\n**TERA BOLO (verbatim, sacred — tere exact shabd):**\n\n[6-tukda master recall — Session 4]\n1 - prefill matlab user ke entered prompt ya data ko read krna, decode is AI model se output generate krvana. input sasta islie hota hain quki user se pura data ek sath mil jata hain to model usko single flow mein read krke uska keyValue cache banake AI model ki company ke GPU mein save krleta hain in one single go by running tokenization embedding in parallel and when it comes to output it is costly because model har word ko generate krte hue Pehle pura prefill ki KV cache read krta hain plus uss word se Pehle jitne words generate kie hain unki KV cache bi read krta hain from company's model GPU\n2- keyValue cache is basically ek notebook banata hain jisme user ke entered prompt ya data ki KV cache hoti hain plus model ke har word ki generated KV cache hoti hain. notebook islie nahi change hoti quki ek baari jo prefill and decode mein KV cache generate hua vo change hi nahi hota kabhi so there is no use to recompute it, just save it in the notebook and retrieve it from there instead of recomputing everything, agar dobara se har cheez ka KV cache nikalna padega to model har word type krne se Pehle purane words dobara read krega and it is not optimal for production level because it will increase the API usage costing and will be very slow. Tradeoff iska ye hain ki agar model ke sath zyda lambi conversation hojae to model har turn pe prefill ka KV cache read krega, apne generated text jo last turn mei die the uska KV cache read krega, jitni zyda chat utni baari ye accumulatively hoga which will ultimately fill model ki context memory soon so the solution for this is RAG [model ko sirf required KV cache bhejo?] [RAG abhi learn nahi kia to clear nahi hain ye]\n3- output costly islie hota hain quki har generated output par prefill ki KV cache read krri jati hain and abhi tak jitne words model ne generate kie hain for reply uski KV cache bi read hoti hain from model company's GPU\n4- streaming basically model jo output banata hain usko word by word display krta hain jisse user ka user experience enrich hota hain usko wait nahi krna padta hai pure reply aane ka, vo word by word aate hue reply ko read kr sakta hain. streaming is for enhanching user experience, isse model ki reply generate krne ki speed par koi asar nahi hota hain. TTFT is Time taken first token ?? [bhul gya full form], inter token is har word ko generate krne ke beech ka time gap\n5 - yaad nahi aaraha kuch bi\n6 - ye pata to hain lekin exact soch nahi paraha hu abhi, demo_mode mein KV cache save krlete hain hum taaki baar baar retrieve na krne pade, API costing kam lagegi baaki abhi soch nahi paraha hoon\n\n[Q1: KV cache ne output sasta banaya — Session 4]\nKV cache nahi hota to har word type krne se Pehle model ko abhi tak kya type kia uska meaning bi to yaad rakhna hain to vo firse meaning nikalta ki abhi tak kya type kia hain, costly ho jata process. KV cache ne output ko sasta banaya hain\n\n[tukda-3 redo: sequential passes — Session 4]\nhar output token prefill ka KV cache read krta hain ye parallel ho jata hain quki model ke paas pura user data hain par har word generate krte hue sequential chalta hain, ek word generate kia KV cache read krke, ab next word type krega to Pehle word ka KV cache dobara read karega to jitne words in output utne sequential passes honge islie output is costly\n\n[Q4: streaming speed — Session 4]\nfast nahi hoga, bs user ko text aata hua dikhta hain word by word by model ke output generation speed same hi rehti hain chahe streaming lagao ya na lagao\n\n[tukda-5 redo: long context = size — Session 4]\nlamba context costly islie because KV cache ki notebook ka size bada save hoga company ke GPU mein and output generate krte hue apne purane replies ko bi read krta hain to computations zyda ho jaegi\n\n[tukda-6 master: output/context/DEMO_MODE/streaming — Session 5]\n1- output chota islie rakhte hain taaki model kam words type karrein because API costing input pe nahi output se measure hoti hain to output length ko control must hain\n2- context chota rakhna islie important hain quki model apne har reply par pura input by user ka KV cache [iska exact word bhul gya] read krta hain and apne purane reply ki KV cache ko bi read krta hain to jaise jaise chat increase hogi model ko utni baari input by user ki KV cache and apne purane replies ki KV cache read krta hain to context memory bloat ho jati hain model ki, iska solution RAG - model ko sirf relevant context hi bhejo next reply generate karne se Pehle\n3- DEMO_MODE mein hum app mein API se mille hue correct answer ko cache karlete hain taaki next baar jab same question aaye to uska result dobara se compute na karna pade model ko because jitni baari compute hoga model se utni baari API calls hongi matlab paisa lagega islie result jo milla AI model se usko python maths and human in the loop se evalaute karke cache karlo and next time jab same problem statement aaye by user to cache se pick karlo instead of calling the API\n4- streaming ki data extraction mein requirement nahi because vaha to humne output ko control kia hua hain and vo fast ho jaega, streaming required hain jab user AI model se chat karega to uska UI experience enrich karne ke lie streaming on rakho taaki usko ye nahi lage ki model/tool hang hogya hain plus word by word generate hoga to user sath sath read bi kar sakta hain answer of AI model ko\n\n[streaming = perceived latency — Session 4]\nstreaming fast nahi krta bs sirf output jaldi dikhana shuru krdeta hain. sabse pehle TTFT hota hain [time to first token] means user ka prompt read krte hi first word bante hi send, total hota hain TTFT +(output tokens x har token ke beech ka gap). streaming sirf UI UX experience for user ko enrich krti hain\n\n[crack-4 confusion (the honest stuck) — Session 5]\nsmjha nahi mein ye cheez - pura model ek paas chalata hain matlab?? read kisko karta hain tokens ko?? ye confusion hain ki jab model user ke prompt ya data ko read karta hain to parallely read karke uske KV cache ko GPU mein save kardeta hain lekin jab apna answer banata hain to har word pe vo user ke KV cache ko read karta hain and model mein kya read karta hain sequentially?? KV cache iska solution hain I know ki vo har word ka KV cache banake jo usne generate kia hain usko GPU mein save krta jaata hain par confusion ye hain ki sequentially vo kya cheez exactly read karta hain??\n\n[crack-4 gold (self-derived weld) — Session 5]\nKV cache nahi hota to lagalo model ne ek word generate kia usko pehle pure model se paas krna padta, dusra word generate karne ke lie dusre + pehle dono ko bhejna padega??\nKV cache ye karta hain ki bs new token ko hi model se pass karvata hain jo logit mein convert ho jata hain and vo new token paas hote hue model se purane token ki KV value read karleta hain??\n\n[crack-4 slip (read the part) — Session 5]\nyes output islie costly because sequential KV cache banta hain, sorry mein question ka ye part read karna bhul gya tha\n\n[DEMO_MODE vs KV cache — Session 5]\ndemo mode mein app ki cache memory mein save hota hain, KV cache model jis company ka hain uske GPU ki memory mein save hota hain\ndemo mode mein model ne jo JSON extract karke bheja hain vo save hota hain, KV cache mein keyValue cache save hota hain [ye bante kaise hain vo hum neural network mein read karenge]\n\n[DEMO_cache risk — Session 5]\npar ye bi to ho sakta hain ki AI data hi galat read karlein and hum usko Demo_cache mein save krva dein to save API calls and costing?\n\n[drive note — Session 5]\nbhai crazy cheez hain AI, DSA jaisi chutiya cheez se to laakh guna zyda interesting hain\n\n**INTERVIEW LINE:** *\"Prefill reads the prompt in one parallel pass and is cheap; decode is sequential - one full forward pass per output token - so output costs 3-5x input. The KV cache stores past keys/values so each pass only computes the newest token, making decode cheaper, not more expensive; turning it off makes it quadratic. Streaming only improves perceived latency, and the cache lives on the provider's GPU. Long context costs more because the cache grows - bigger VRAM footprint and more to read each step.\"*"},{"axis":"i","title":"3 ways (CEO / junior / skeptic)","strike":"'Temperature' teen logon ko samjha: CEO, junior engineer, skeptical senior. Register badal.","weld":"CEO: creative-freedom knob, financial data pe zero (auditable, predictable). Junior: code-set value; logits->softmax(%)->temperature menu sharp/flat. Skeptic: temp accuracy nahi (sirf next-word selection), galat logit temp=0 consistently repeat; accuracy Pydantic+maths+human; AI assistant not decision-maker. [threeWays = inhi ke polished cards.]","status":"held","deep":"**SAWAL:** *\"Ek hi cheez — 'temperature' — teen logon ko samjha: CEO, junior engineer, aur ek skeptical senior. Register badal.\"*\n\n**POORA JAWAB:**\n- **CEO (business):** temperature = AI ko kitni \"creative freedom\" deni hai. Financial data pe **zero** — jo aaya waisa hi padho, waisa hi do.\n- **Junior (mechanism):** code-set value; logits → softmax (%) → temperature menu ko **kitna flat/spread** karna decide karti.\n- **Skeptic (limits):** temp **accuracy nahi** deta — sirf next-word kya aaye vo; galat logit ko temp=0 consistently repeat karega; accuracy **Pydantic + maths + human** se.\n\n**TERA BOLO (verbatim, sacred — tere exact teeno register, Session 1):**\n\n[CEO]\nceo ko I will say ki temperature is basically ki AI apke data ya prompt pe jawab kitni creative freedom se dega? since we are dealing with financial data to hummein chahiye ekdum close to zero creativity from AI model, matlab jo cheez jaise aarahi hain user se usko vaise hi read kro and vaise hi exactly jawab do\n\n[Junior]\njunior ko I will say ki temperature is basically a value which we set inside our code, sabse Pehle hum logits banate hain har word ka neural network use krke yaha pe hummein ek score milta hain par score ko acche se read krne ke lie hum SoftMax method use krte hain jaha hum e^(score of individual logit) nikalte hain and fir sab values jo nikli hain sabko sum krke individually e^(score of individual logit) se divide krdete hain to hummein % mil jati hain. temperature basically ye batata hain hain ki logit ko kitna flat ya spread krna hain. temperature nikalne ke lie formula bhul gya\n\n[Senior/Skeptic]\nsenior ko kahunga ki tradeoff ye hain ki galat reading krli agar AI ne and agar humne temp 0 kia hua h to vo uss galat reading of data ke hisab se apne logit se answer dega islie code se validate krvana jaruri hain AI ka output. ab code se hi pura kyu na krva lia jaein vo islie hain ki code har user se added data files read nahi kr sakta because they can be in different different formats to AI does what it does best and code does what it does best which is validating\n\n**INTERVIEW LINE:** *\"To a CEO: temperature is how much creative freedom the AI gets - zero for financial data. To a junior: it's a knob that sharpens or flattens the softmax distribution before sampling. To a skeptic: it controls consistency, not accuracy - that comes from validation, not from temperature.\"*"}],"threeWays":{"ceo":"Temperature = AI ko kitni creative freedom deni hai. Financial data pe hum chahte hain ekdum zero creativity - jo cheez user se aa rahi hai usko waisa hi padho aur waisa hi exact jawab do. Iska business matlab: same invoice par hamesha same result -> auditable, predictable, compliance-safe. Galti ki gunjaish kam, har Rs81 crore decision par bharosa zyada. Creative variety marketing copy ke liye theek, par paise ke kaam mein woh bug hai, feature nahi.","junior":"Sabse pehle neural network har word ka logit (raw score) banata. Score ko padhne ke liye softmax: har logit ka e^(score), sab values ka sum, phir har e^(score) ko sum se divide -> %. Yeh ek menu/scoreboard ban jaata poori vocab pe. Temperature decide karti is menu ko kitna sharp ya flat karna - formula e^(score/T), softmax ke andar e^ se pehle. Kam temp = sharp menu (garbage% neeche), zyada temp = flat (garbage% upar). Phir top-k/top-p menu trim karte, phir ek token pick (sampling) - greedy agar T=0, warna weighted-random. Token append, loop. Menu BANANA model ka kaam (training-baked); menu se UTHANA developer ke knobs.","skeptic":"Do baat seedhi: (1) temperature accuracy NAHI deta - woh sirf decide karta agla word menu se kaise picked hoga. Agar model ne data hi galat padha (bad logits, upstream), to temp=0 us galti ko consistently repeat karega - confident-wrong. Accuracy alag layer se: Pydantic (shape) + business-maths (subtotal+GST=total, TDS) + confidence-gated human. (2) temp=0 = CONSISTENCY, not correctness. Isliye 'AI proposes, code validates, human approves.' Aur cost: asli kharcha output + context-length pe (sequential decode-passes + bada KV cache), input pe nahi - isliye tight JSON + RAG + app-level caching. KEY: AI assistant hai, final decision-maker nahi."},"traps":[{"bait":"Temperature words ko % assign karta hai - temp hata do to words ki % chali jaegi.","wrong":"Ulta soch hai.","truth":"Model (softmax over logits) % banata hai - woh hamesha hota. Temperature sirf us bane-banaye menu ko reshape karti (sharp/flat). % temperature se pehle baked hain."},{"bait":"Extraction mein temp=0.7 lagao - flexible hoga to zyada 'smart'/accurate.","wrong":"Flexibility ko accuracy samajh liya.","truth":"Extraction = determinism chahiye -> temp=0. Variety yaha inconsistency = bug. Accuracy temp se nahi, code-validation (Pydantic + maths + human) se aati."},{"bait":"Logit aur embedding same cheez hain - dono to vectors/numbers hain.","wrong":"Pipeline ke opposite sire hain.","truth":"Embedding = ENTRY (input ID -> meaning-vector). Logit = EXIT (meaning -> har vocab-word ka raw score). Alag jagah, alag kaam - inhe mat mila."},{"bait":"Tokenization/embedding sirf shuru mein ek baar hote hain (input padhne ko).","wrong":"Inference ek LOOP hai.","truth":"Har step pe context process hota (KV cache se optimize - purana recompute nahi, par loop chalu). Single-shot 'ek baar' nahi."},{"bait":"Repetition loop ('the the the') fix karne ko temperature MAX kar do.","wrong":"Max = garbage, fix nahi.","truth":"Thoda randomness loop tod sakta, par MAX temp menu flat -> garbage% upar -> shor. Sweet-spot chahiye. (Aur yeh long-gen ka issue hai; extraction mein hota hi nahi.)"},{"bait":"DEMO_MODE caching aur KV cache same cheez hain.","wrong":"Alag layers.","truth":"DEMO_MODE = app-level (validated JSON response replay - same Q to API skip). KV cache = GPU-level (attention ke K/V, neural-net internals). Bilkul alag."},{"bait":"temp=0 lagaya hai to bhi top-k/top-p set karna zaroori hai.","wrong":"Over-engineering.","truth":"T=0 = greedy = hamesha #1. Top-k/top-p tab redundant. Sirf jo knob matter karta usse chhedo - baaki defaults."},{"bait":"Output mehnga islie hai kyunki bada KV cache read karna padta.","wrong":"KV cache to SASTA banata.","truth":"Output mehnga = SEQUENTIAL forward-passes (jitne output tokens utne full passes). KV cache us cost ko GHATATA hai (har pass sirf newest token), badhata nahi."},{"bait":"RAG model ko sirf relevant KV cache bhejta hai.","wrong":"RAG TEXT trim karta, KV nahi.","truth":"RAG relevant text chunks input mein daalta -> input chhota -> KV cache khud chhota ban-ta. RAG 'KV cache bhejta' nahi - woh input-text control karta."},{"bait":"KV cache user ke laptop/RAM mein hota hai.","wrong":"Company ke GPU pe.","truth":"API model company ke GPU (VRAM, Anthropic/OpenAI datacenter) pe chalta - KV cache wahin. User sirf text bhejta aur leta, uske machine pe kuch cache nahi."}],"bridges":[{"to":"tokenization","conn":"tokenization -> inference","q":"Inference ka asli input kahan se aata?","a":"Tokenization text ko IDs deta -> embedding meaning-vector -> neural-net process -> logits. Inference us poori pipeline ka RUN-step (loop mein token-by-token)."},{"to":"embeddings","conn":"embeddings (entry) -> logits (exit)","q":"Logit aur embedding - same cheez?","a":"Nahi. Embedding = pipeline ki ENTRY (input -> meaning-vector). Logit = EXIT (meaning -> per-vocab raw score). Do opposite sire. Inhe mat mila."},{"to":"context","conn":"KV cache SIZE -> context window limit","q":"Lamba context mehnga - context window se kya rishta?","a":"Context window = KV cache ki memory LIMIT ka naam. Jitna bada context utna bada cache; bhar jaye to truncate/error. (Yeh concept #4 ke baad #6 mein deep.)"},{"to":"hallucinations","conn":"high temp / bad logits -> confident-wrong","q":"Inference se galat output kaise nikalta?","a":"High temp garbage-tail boost karta -> bakwaas; ya bad logits upstream -> koi bhi temp galat hi dega. Fluent-but-wrong = hallucination ka ek raasta."},{"to":"neural-net","conn":"training weights -> inference run + KV internals","q":"Menu (logits) banta kahan se, aur KV ke K/V exactly kya?","a":"Training mein weights set; inference un frozen weights se har step logits nikaalta. KV cache ke K/V (attention internals) ka asli mechanism = concept #4 (Neural Net)."}],"doubts":[{"q":"Temperature exactly kya hai aur kahan set hoti hai?","a":"Code mein developer-set value. Softmax ke andar logit ko T se divide karke menu ko sharp/flat karti. Khud % assign nahi karti - sirf reshape."},{"q":"Softmax % kaise nikaalta - steps?","a":"(1) har logit ka e^(score), (2) sab add (sum), (3) har e^(score) ko sum se divide -> %."},{"q":"Temperature ka formula kya hai? (S1 mein bhool gaya tha)","a":"e^(logit/T) - T se divide INSIDE, phir e, phir softmax. Baad ki session mein recall hua."},{"q":"Logit, top-k, top-p, temperature - ye sab inference ke parts hain kya?","a":"Haan - sab ek hi inference pipeline ke parts, ek dusre se juड़े. Yeh tera pehla 'aha' connect tha."},{"q":"Agar AI galat read kare aur temp=0 ho to kya hota?","a":"Galti logit-banane mein hoti. temp=0 sirf highest-% pick karta = galat logit baar-baar = consistent galat. Isliye code validation zaroori."},{"q":"temp=0 pe model creative kyun nahi hota?","a":"T=0 = sirf #1 logit pick, koi randomness/choice nahi = deterministic."},{"q":"CEO ko temperature kaise samjhaaun?","a":"'Creative freedom' ki knob - financial data pe zero creativity chahiye, jo aaya waisa hi padho-do."},{"q":"Junior ko kaise?","a":"Code-set value; logits -> softmax (%) -> temperature menu ko kitna flat/spread karna decide karti."},{"q":"Senior ko tradeoff kya bataun?","a":"Galat reading + temp=0 = confident-wrong; isliye code se validate. Code akela nahi - varied formats read nahi kar sakta."},{"q":"Code se hi pura kyun na kara lein?","a":"Code messy/varied invoice layouts read nahi kar sakta (300-rules likho phir bhi naya format crash). AI reads, code validates - dono apni strength."},{"q":"Softmax ka divide step - kya divide karte hain?","a":"Har individual e^score ko SAB e^scores ke SUM se (raw scores ke sum se NAHI)."},{"q":"Temperature output hai ya input?","a":"INPUT/knob - menu banne se pehle logit reshape karti; koi output-number nahi deti."},{"q":"Inference kab break hota hai - kitne cases?","a":"3: temp too high (flat -> garbage snowball), temp 0/greedy + pause (repetition loop, sirf long-gen), menu khud galat (bad logits, upstream - temp se bahar)."},{"q":"High temp pe garbage kyun aata?","a":"Flat menu -> garbage tokens ki % upar -> pick hone ka chance zyada -> ek garbage pick to model pura sentence repeat karta -> next bhi garbage -> snowball."},{"q":"Temperature accuracy deta hai?","a":"Nahi - sirf next-word kya aaega vo. Accuracy = Pydantic + maths + human."},{"q":"Worked example - T=0.5 aur T=2 pe Eco% kya?","a":"T=0.5 scores double -> Eco ~92% (sharp); T=2 scores half -> Eco ~54% (flat)."},{"q":"Kam temp = sharp ya broad menu? (label-swap pakda)","a":"SHARP - garbage% NEECHE. Pehle 'broad' bola tha, khud palta."},{"q":"Zyada temp = ?","a":"FLAT - garbage% UPAR."},{"q":"Greedy vs weighted-random alag toggle hai?","a":"Nahi - temperature ka NATIJA. T=0 = greedy, T>0 = weighted-random."},{"q":"Softmax-with-temperature ka full calc?","a":"e^(logit/T) har token -> sum -> har ko sum se divide -> %."},{"q":"Prefill vs decode kya - kaun sasta?","a":"Prefill = input read (parallel, single pass, sasta); decode = output generate (sequential, mehnga)."},{"q":"Output 3-5x mehnga kyun?","a":"Har output token = poora model ka ek SEQUENTIAL forward-pass; jitne output words utne passes. NOT KV-cache-size, NOT re-tokenization."},{"q":"KV cache kya karta?","a":"Notebook of K/V notes (input+output), kabhi badalta nahi -> reuse -> har pass sirf newest token compute, purane KV GPU se read -> recompute bachta."},{"q":"KV cache OFF to kya?","a":"Har naya word se pehle saare purane dobara pass -> quadratic (1+2+...+N) -> slow + mehnga."},{"q":"Streaming fast karta hai?","a":"Nahi - sirf output jaldi dikhata (TTFT + output x inter-token gap). Actual speed same; pure UX."},{"q":"Lamba context mehnga kyun?","a":"Driver = SIZE: bada KV cache -> GPU VRAM zyada + har step bada notebook read -> compute zyada. Solution RAG (relevant context bhejo)."},{"q":"KV cache kahan hota - user RAM mein?","a":"Nahi - company ke model GPU (VRAM) pe. User sirf text bhejta/leta, uske machine pe kuch nahi."},{"q":"'Pura model ek pass chalata' matlab - sequentially exactly kya read karta?","a":"Har output token ke liye model ka ek full forward-pass; us pass mein newest token compute + purane tokens ki KV (GPU se) read. Sequential = ek-ke-baad-ek passes."},{"q":"KV cache nahi hota to dusra word kaise banta?","a":"Pehla+dusra dono dobara pass karne padte. KV se sirf naya token pass, purane ki KV read. Isliye KV output ko SASTA banata, mehnga nahi."},{"q":"DEMO_MODE aur KV cache same?","a":"Nahi - DEMO_MODE = app-level (validated JSON response cache, same Q -> API skip). KV cache = GPU-level (attention K/V, neural-net internals). Alag layers."},{"q":"AI galat read kare aur DEMO_cache mein save ho jaye to?","a":"Risk hai - isliye cache karne se pehle Python-maths + human-in-loop se validate, fir store. Galat ko cache kiya to consistently galat dega."},{"q":"next word generation pe firse API call... par hum KV cache GPU mein save karlete to model bs vo read karleta?","a":"Next-WORD = SAME api call, KV cache REUSED, koi full reprocess nahi. Next-MESSAGE = naya call, fresh KV (folder dobara fed). DO alag LEVEL - ghol diya tha. Calls ke beech amnesiac; ek reply ke andar KV-memory."},{"q":"ek reply mein menu same rehta hain","a":"GALAT. Ek reply ke ANDAR menu har WORD pe FRESH. Same rehta = api call + KV cache; badalta = menu (naya sawaal har word)."},{"q":"menu... batata bi ki conversation abhi tak kya chalrahi hain?","a":"NAHI. 'Ab tak kya hui' = CONTEXT ka kaam; menu sirf next-word %-scoreboard. Context SE menu banta, par menu history rakhta NAHI."},{"q":"vocab se aata to menu se hota kya hain? KV cache banta? menu ka use case kya?","a":"Pick MENU se (vocab=pool, khud decide nahi); menu = next-word decision (generation ka dil); menu != KV cache; picked token ka K/V BAAD mein cache mein add. Menu ka use = 1 lakh ki andhi list mein se sahi agla word chunna."},{"q":"kv cache to vocab se banta hain na jo corpus se bana?","a":"NAHI. 3 DABBE: corpus (training mein 1x padha, phenka) -> vocab+embedding-matrix (frozen, sab ke liye same, PERMANENT) -> KV cache (tere folder ke tokens se, runtime, per-call FRESH, GPU pe, call ke baad GAYA). vocab/embedding = AUZAAR; KV cache = is-baar-ka kaam."}],"calibration":"5-session arc (23->24 Jun): start FinOps-narrow (Nikhil ne socha inference/temperature sirf FinOps ke liye) -> Jirah ne FUNDAMENTAL khola (har LLM ka run-step) -> 9/9 Jirah HELD -> tempered. SABSE BADA STORY: output-cost crack 4 BAAR surface hua across sessions (output mehnga = KV-cache-size? re-tokenization? purane dobara read?) -> finally Session 4-5 mein Nikhil ke APNE read-vs-pass derivation se PERMANENTLY welded: output mehnga = SEQUENTIAL full-forward-passes (jitne output tokens utne passes), KV cache us cost ko GHATATA (har pass sirf newest token), badhata nahi. Yeh #1 deep stuck->weld. CRACKS WELDED: (1) softmax-divide - 'individual e^score ko SAB e^scores ke sum se' (raw sum se nahi); (2) temperature = INPUT/knob, output nahi; (3) sharp/flat LABEL-SWAP - kam temp = SHARP (garbage% neeche), zyada = FLAT (garbage% upar) - khud pakda aur palta; (4) output-cost = sequential passes NOT KV-read (4x surface, self-derived weld); (5) DEMO_MODE (app-level) vs KV cache (GPU-level) - alag; (6) RAG = text-trim (KV nahi); (7) KV = company GPU, user RAM nahi; (8) greedy/weighted = temperature ka natija, alag toggle nahi. PATTERN-1 (sub-piece overload): jab logit/softmax/temp/top-k/p/prefill/decode/KV ek saath pile up -> big picture loose -> pipeline re-state karne se anchor wapas. PATTERN-2 (self-doubt below reality): Nikhil ne khud ko 'half-baked / library mein theek record nahi hua' bola jabki recall actually solid tha - honestly called, no hype. GENERATION-EFFECT strong: har 'kyun' khud poocha, ratta nahi ('DSA se laakh guna interesting' = intrinsic drive). CLAUDE-SIDE honesty: worked-example numbers ko consistent rakhna pada (do thode-alag sets the); axis-h ko Layer-A (cache-what/cost) vs Layer-B (K/V internals, attention) split kiya - Layer-B concept #4 ko defer. FRESHNESS: FRESH lock - Re-Jirah day-3 (27 Jun) PENDING. SENIOR-ADD next Re-Jirah: top-p adaptive-cutoff ka France-vs-hobby example cold-recall; temperature formula (e^(logit/T)) blind-recall (S1 mein slip hua tha).","buildHook":"FinOps invoice extraction: temperature=0 (deterministic - same invoice = same JSON, reproducible + auditable). Defend: 'structured + correctness-critical; sampling variety = vendor-mix/number bug; temp=0 = CONSISTENCY not accuracy.' Accuracy alag layer: Pydantic (shape) + business-maths (subtotal+GST=total, TDS) + confidence-gated human-in-loop. 'AI proposes, code validates, human approves.' COST (output side, input nahi): (1) tight JSON output -> kam sequential decode-passes; (2) RAG se relevant chunk -> chhota input -> chhota KV cache; (3) DEMO_MODE app-level caching (validated response replay, KV cache NAHI); (4) streaming chat-UX ke liye, extraction ke liye nahi. api_logs (Day-1): tokens + latency + cost track. Senior signal: jahan AI creatively NAHI lagani (deterministic extraction), aur asli cost kahan (output + context-length, input nahi). BIGGER: yehi sampling/cost samajh har LLM feature pe lagti (chat, RAG, agents).","interviewLines":["Inference is the trained model running - one token at a time, in a loop; at each step it builds a probability distribution over the whole vocabulary and samples one token.","Logits are the raw scores from the network; softmax turns them into a probability menu; sampling picks from it - three distinct stages.","Temperature reshapes the distribution before sampling - low temp sharpens it toward greedy, high temp flattens it; it doesn't assign the probabilities, the model does.","The model bakes the menu via trained weights; the developer only controls how we pick from it - temperature, top-k, top-p.","Top-k keeps a fixed number of candidates; top-p (nucleus) keeps a cumulative-probability mass, so it adapts to context - I generally prefer top-p.","Greedy vs weighted-random isn't a separate switch - it's the consequence of temperature: T=0 is greedy, T>0 is weighted sampling.","For invoice extraction I set temperature to 0 - structured, correctness-critical work where the same invoice must yield the same JSON, so it's reproducible and auditable.","Temperature gives consistency, not accuracy - if the logits are wrong upstream, T=0 just repeats the mistake reliably; accuracy comes from Pydantic, business-math checks, and human-in-the-loop.","Output tokens cost far more than input - prefill reads the prompt in one parallel pass, but decode is sequential: one full forward pass per output token.","The KV cache makes decode cheaper, not more expensive - it stores past keys/values so
