<script>
(function(){
var $=function(id){return document.getElementById(id);};
function num(v){return Math.round(v*1000)/1000;}

var LINES=[
 "A neural network is a model that learns its rules from examples instead of having them hand-written, and it stores what it learned as numbers.",
 "Inputs are the numbers fed into the network; the output is the number it produces, which is its prediction.",
 "An LLM converts each token to a token ID, looks up that ID's row in a learned embedding matrix, and feeds the resulting vector of numbers into the first layer as its inputs.",
 "A weight is a learned number that the network multiplies an input by; it controls how strongly, and in which direction, that input affects the output.",
 "A neuron takes several inputs, multiplies each by its own weight, and adds the results into a weighted sum.",
 "A bias is a learned number added to the weighted sum, so a neuron can output something sensible even when all its inputs are zero.",
 "An activation function is a simple non-linear rule applied to a neuron's weighted sum plus bias; ReLU outputs zero for negatives and passes positives through.",
 "Neurons are arranged in layers; each layer takes the previous layer's outputs as its inputs. \"Deep\" learning just means many hidden layers.",
 "Training means the network predicts, measures how wrong it was with a loss function, and nudges every weight and bias to reduce the loss; this is gradient descent.",
 "The learning rate sets how big each update is; too small and training crawls, too large and the weights overshoot or diverge.",
 "Training adjusts the weights; inference runs the trained network with frozen weights on new inputs, which is just a forward pass.",
 "A model's parameter count is the total number of learned weights and biases; an 8B model has about 8 billion of them."
];

var I=[
/* ---------- NAKSHA ---------- */
{id:'naksha',name:'Naksha',title:'Poora axis ek picture mein',
 pic:'<div class="row"><span class="c cin" data-k="in">input</span><span class="op">×</span><span class="c ckn" data-k="w">weight</span><span class="op">→ jodo →</span><span class="c cbi" data-k="b">+ bias</span><span class="op">→</span><span class="c cbx" data-k="a">activation</span><span class="op">→</span><span class="c cou" data-k="o">output</span></div>'+
     '<div class="row"><span class="c cer" data-k="t">galti (loss) dekh ke weight aur bias ghumao, baar baar = training</span></div>',
 beats:[
  {tag:'Yeh deck kaise chalega',hl:[],html:'<p class="bt">Har idea ek screen hai. Upar ki picture wahi rehti hai, aur neeche ka text ek ek karke badalta hai. Text jis cheez ki baat karega, picture mein wahi hissa chamkega. Bas <b>Aage</b> dabao, ya → key.</p>'},
  {tag:'Rang ka matlab',hl:['in','w','b','o','t'],html:'<p class="bt">Neela matlab input, amber matlab weight (knob), baingani matlab bias, teal matlab output, aur laal matlab galti. Har screen pe har rang ka matlab yahi rahega.</p>'},
  {tag:'Poora axis, ek line',hl:['in','w','b','a','o'],html:'<p class="bt">Input andar aata hai. Har input apne weight se guna hota hai, sab jud jaate hain, upar se bias judta hai, activation lagta hai, aur output nikalta hai.</p>'},
  {tag:'Aur seekhna',hl:['t'],html:'<p class="bt">Output asli jawab se milaya jaata hai. Galti dekh ke weights aur bias thoda thoda ghumaye jaate hain, aur yeh baar baar hota hai. Isi ko training kehte hain. Agle screens mein har tukda alag se khulega.</p>'}
 ]},
/* ---------- NEURAL NETWORK KYA HAI ---------- */
{id:'nn',name:'Neural network kya hai',title:'Rule insaan likhta hai, ya machine data se seekhti hai?',
 pic:'<div class="two"><div class="opt" data-k="r1"><b>Raasta 1 · normal software</b>Manager khud rule likhta hai: "aaj ki sale se 20% zyada".</div><div class="opt" data-k="r2"><b>Raasta 2 · neural network</b>Machine 365 din ka data dekhti hai aur rule khud nikaalti hai.</div></div>'+
     '<div class="row" data-k="flow"><span class="c cin">365 din ka data</span><span class="op">→</span><span class="c ckn mono">1.2 · 0.7 · 3.4 …</span><span class="op">→</span><span class="c cou">kal ka order</span></div>',
 beats:[
  {tag:'Dukaan · Raasta 1',hl:['r1'],html:'<p class="bt">Normal software mein rule insaan likhta hai: "aaj ki sale se 20% zyada mangwao". Machine bas woh rule chalati hai. Agar rule galat nikle, toh insaan ko hi baith ke badalna padega.</p>'},
  {tag:'Dukaan · Raasta 2',hl:['r2','flow'],html:'<p class="bt">Neural network ko koi rule nahi diya jaata. Use 365 din ka data milta hai: har din kitna bika, aur agle din asal mein kitna laga. Usse machine apne andar kuch numbers set karti hai, aur wahi numbers uska rule ban jaate hain.</p>'},
  {tag:'Asli naam',hl:['r2','flow'],html:'<p class="bt"><span class="term">neural network</span>: ek machine jo examples dekh ke apna rule khud seekhti hai, aur woh rule apne andar numbers ki shape mein rakhti hai.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['r2','flow'],html:'<p class="tline">'+LINES[0]+'</p>'},
  {tag:'Khud karo',cls:'khud',hl:['r1','r2'],type:'num',ans:2,
   html:'<p class="bt">Zomato ke do systems hain. <b>1</b> = GST calculator, jo har bill pe fixed 5% lagata hai. <b>2</b> = "order cancel hoga ya nahi" wala andaaza, jo laakhon purane orders dekh ke bana. Neural network kaunsa hai? Number likho.</p>',
   why:'Doosra wala. GST ka rule insaan ne likha, jabki cancel wala rule data se seekha gaya. Calculation dono karte hain; farak yeh hai ki rule aaya kahan se.'}
 ]},
/* ---------- INPUT AUR OUTPUT ---------- */
{id:'io',name:'Input aur output',title:'Kya andar jaata hai, kya bahar aata hai',
 pic:'<div class="row"><span class="c cin" data-k="i1">sale = 20</span><span class="c cin" data-k="i2">kal Sunday = 1</span><span class="op">→</span><span class="c cbx" data-k="m">machine</span><span class="op">→</span><span class="c cou" data-k="o">kal ka order = ?</span></div>'+
     '<p class="small dim" style="text-align:center" data-k="enc">haan/nahi bhi number banta hai: Sunday = 1, baaki din = 0 · baarish = 1, nahi = 0 · distance = kitne km</p>',
 beats:[
  {tag:'Dukaan · input',hl:['i1','i2'],html:'<p class="bt">Kal ka order banane se pehle manager kuch cheezein dekhta hai: aaj kitna bika, aur kal Sunday hai ya nahi. Jo cheezein machine ke andar jaati hain, unhe inputs kehte hain.</p>'},
  {tag:'Har cheez number',hl:['i2','enc'],html:'<p class="bt">Machine sirf numbers samajhti hai. Isliye "haan ya nahi" jaisi cheez bhi number banti hai: Sunday ho toh 1, warna 0.</p>'},
  {tag:'Dukaan · output',hl:['o'],html:'<p class="bt">Machine jo number bahar deti hai, jaise "kal 36 packet", woh output hai. Yeh uska andaaza hota hai, isliye isko prediction bhi kehte hain.</p>'},
  {tag:'Asli naam',hl:['i1','i2','o'],html:'<p class="bt"><span class="term">input</span>: har woh number jo machine ke andar jaata hai.<br><span class="term">output</span> / <span class="term">prediction</span>: machine jo number bahar deti hai, yaani uska andaaza.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['i1','i2','o'],html:'<p class="tline">'+LINES[1]+'</p>'},
  {tag:'Khud karo',cls:'khud',hl:['enc'],type:'num',ans:1,
   html:'<p class="bt">Zomato delivery ke model mein ek input hai "baarish ho rahi hai?". Aaj baarish ho rahi hai. Is input ka number kya hoga?</p>',
   why:'1. Haan = 1, nahi = 0. Machine ko "haan" word nahi chahiye, use number chahiye.'}
 ]},
/* ---------- LLM KE INPUT NUMBERS ---------- */
{id:'llminput',name:'LLM ke input numbers',title:'LLM ke inputs: yeh numbers aate kahan se hain',
 pic:'<div class="row"><span class="c cbx" data-k="t">"doodh"</span><span class="op">→</span><span class="c cbx" data-k="tok">token</span><span class="op">→</span><span class="c cbx mono" data-k="id">token ID 18342</span></div>'+
     '<div class="row"><span class="op">→</span><span class="c ckn" data-k="row">embedding matrix ki row 18342</span><span class="op">→</span><span class="c cin mono" data-k="vec">0.21 · −0.83 · 0.05 …</span></div>'+
     '<div class="row"><span class="op">→</span><span class="c cou" data-k="l1">pehli layer ke inputs</span></div>'+
     '<div data-k="prof" class="small" style="display:flex;flex-direction:column;gap:3px;align-items:center"><span class="dim">samajhne wala profile card (kharab hona · breakfast · mehenga):</span><span class="mono">doodh 0.9 · 0.95 · 0.3 &nbsp; dahi 0.85 · 0.7 · 0.3 &nbsp; cement 0 · 0 · 0.6</span></div>',
 beats:[
  {tag:'Text se token',hl:['t','tok'],html:'<p class="bt">LLM ko pehle text milta hai, jaise "doodh". Woh tokens mein tootta hai. Yahi tumhara tokenization wala topic hai.</p>'},
  {tag:'Token ID = sirf address',hl:['id'],html:'<p class="bt">Har token ka ek number hota hai, jaise 18342. Yeh Blinkit ke SKU code jaisa hai: sirf ek address. Is number se doodh ka matlab pata nahi chalta. (18342 bas ek misaal hai; asli ID har model ki vocabulary pe depend karti hai.)</p>'},
  {tag:'Dukaan · profile card',hl:['row','prof'],html:'<p class="bt">Warehouse ke paas har product ka ek "profile card" bhi hota hai, jisme numbers likhe hote hain: kitni jaldi kharab hota hai, breakfast mein kitna aata hai, kitna mehenga hai. Model bhi apni embedding matrix mein us token ID wali row uthata hai. Woh row hi token ka profile card hai.</p>'},
  {tag:'Yahi inputs hain',hl:['vec','l1'],html:'<p class="bt">Woh row numbers ki ek line hai, jaise 4096 numbers. Har number ek input hai, aur har input ka apna weight hota hai. Yahi line LLM ki pehli layer mein jaati hai.</p>'},
  {tag:'⚠ Trap, tumhare embeddings notes se',cls:'trap',hl:['prof'],html:'<p class="bt">Asli numbers pe "kharab hona" ya "breakfast" jaise label nahi hote. Kaunsi position kya pakdegi, yeh machine training mein khud tay karti hai, aur woh insaan ke padhne layak nahi hota. Yeh key-value nahi hai, bas plain numbers ki ek fixed-length line hai.</p>'},
  {tag:'Asli naam',hl:['id','row','vec'],html:'<p class="bt"><span class="term">token ID</span>: vocabulary mein token ka number, sirf address.<br><span class="term">embedding matrix</span>: numbers ki badi grid jisme har token ki ek row hoti hai. Yeh training mein seekhi jaati hai.<br><span class="term">embedding vector</span>: ek token ki row, yaani uske meaning ke numbers.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['id','row','vec','l1'],html:'<p class="tline">'+LINES[2]+'</p>'},
  {tag:'Khud karo',cls:'khud',hl:['prof'],type:'reveal',
   html:'<p class="bt">Profile card dekho: doodh, dahi aur cement mein se kaunse do ke numbers sabse kareeb hain, aur iska matlab kya hai? Pehle khud socho.</p>',
   why:'Doodh aur dahi: teeno numbers paas paas hain, matlab model ke liye dono ka meaning milta-julta hai. Cement ke numbers bilkul alag hain, isliye woh door hai.'}
 ]},
/* ---------- WEIGHT ---------- */
{id:'weight',name:'Weight',title:'Weight: ek knob jo input ko guna karta hai',
 pic:'<div class="row"><span class="c cin" data-k="s">aaj bika <b id="ws_v">20</b></span><span class="op">×</span><span class="c ckn" data-k="w">weight <b id="ww_v">1.5</b></span><span class="op">=</span><span class="c cou" data-k="o">kal ka order <b id="wo_v">30</b></span></div>'+
     '<label class="lab" for="ws">Aaj ki sale (input)</label><input type="range" id="ws" min="0" max="50" step="1" value="20">'+
     '<label class="lab" for="ww">Weight (knob)</label><input type="range" id="ww" min="-1" max="2" step="0.1" value="1.5">'+
     '<p class="small dim" id="wn" style="text-align:center"></p>',
 init:function(){function u(){var a=+$('ws').value,w=Math.round(+$('ww').value*10)/10;$('ws_v').textContent=a;$('ww_v').textContent=w.toFixed(1);$('wo_v').textContent=num(a*w);
   $('wn').textContent=w<0?'Weight minus: yeh input order ko ghata raha hai':(w===0?'Weight 0: yeh input matter hi nahi karta':(w<1?'Weight 1 se kam: order sale se chhota':(w===1?'Weight 1.0: order bilkul sale jitna':'Weight 1 se zyada: order sale se bada')));}
   $('ws').addEventListener('input',u);$('ww').addEventListener('input',u);u();},
 beats:[
  {tag:'Dukaan',hl:['w'],set:{ws:20,ww:1.5},html:'<p class="bt">Sabse chhoti machine ka rule itna hi hai: aaj ki sale × ek number = kal ka order. Woh number ek knob hai. Slider se knob ghumao aur dekho order kaise badalta hai.</p>'},
  {tag:'Knob ke positions',hl:['w','o'],set:{ww:1.2},html:'<p class="bt">1.0 pe order bilkul utna hi hota hai jitna bika. 1.2 pe thoda extra, aur 0.8 pe kam. Dukaan wahi, sale wahi, sirf knob ghumaya aur order badal gaya.</p>'},
  {tag:'0 aur minus',hl:['w'],set:{ww:0},html:'<p class="bt">Knob 0 pe ho, toh woh input matter hi nahi karta. Knob minus mein bhi ja sakta hai, aur tab woh input order ko ghatata hai. Slider ko −0.5 tak le jaake dekho.</p>'},
  {tag:'Asli naam',hl:['w'],set:{ww:1.5},html:'<p class="bt"><span class="term">weight</span>: machine ke andar ka ek seekha hua number, jisse ek input ko guna kiya jaata hai. Yahi knob hai. Bada weight matlab woh input zyada matter karta hai.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['s','w','o'],html:'<p class="tline">'+LINES[3]+'</p>'},
  {tag:'Khud karo',cls:'khud',hl:['s','w','o'],type:'num',ans:30,html:'<p class="bt">Aaj 20 packet bika aur weight 1.5 hai. Kal ka order kitna hoga? (Tumne yeh kar liya tha, ek baar phir haath se karo.)</p>',why:'20 × 1.5 = 30 packet.'}
 ]},
/* ---------- NEURON ---------- */
{id:'neuron',name:'Neuron',title:'Neuron: har input × apna weight, phir sab jodo',
 pic:'<div class="row" data-k="l1"><span class="c cin">sale 10</span><span class="op">×</span><span class="c ckn">1.5</span><span class="op">=</span><span class="c cbx mono">15</span></div>'+
     '<div class="row" data-k="l2"><span class="c cin">Sunday <b id="nsv">1</b></span><span class="op">×</span><span class="c ckn">6</span><span class="op">=</span><span class="c cbx mono" id="nsr">6</span></div>'+
     '<div class="row" data-k="sum"><span class="op">sab jodo →</span><span class="c cou">weighted sum <b id="nso">21</b></span><button id="nst">Sunday on / off</button></div>',
 init:function(){var s=1;function d(){$('nsv').textContent=s;$('nsr').textContent=s*6;$('nso').textContent=15+s*6;}$('nst').onclick=function(){s=1-s;d();};d();},
 beats:[
  {tag:'Dukaan · pehla input',hl:['l1'],html:'<p class="bt">Asli manager sirf sale nahi dekhta, aur bhi cheezein dekhta hai. Pehla input hai sale, aur uska knob 1.5 hai: 10 × 1.5 = 15.</p>'},
  {tag:'Doosra input, apna knob',hl:['l2'],html:'<p class="bt">Doosra input hai "kal Sunday hai?". Sunday ko doodh zyada bikta hai, isliye iska apna alag knob hai, 6. Matlab "Sunday ho toh 6 packet extra": 1 × 6 = 6.</p>'},
  {tag:'Sab jodo',hl:['sum'],html:'<p class="bt">Machine har input ko uske apne knob se guna karti hai, phir sabko jod deti hai: 15 + 6 = 21. Button dabake dekho, Sunday off karne pe kya hota hai.</p>'},
  {tag:'Asli naam',hl:['l1','l2','sum'],html:'<p class="bt"><span class="term">neuron</span>: ek chhoti unit jo har input ko uske apne weight se guna karti hai aur sabko jodti hai.<br><span class="term">weighted sum</span>: "har input × uska weight" ka total.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['l1','l2','sum'],html:'<p class="tline">'+LINES[4]+'</p>'},
  {tag:'⚠ Yahan atke the',cls:'trap',hl:['l2'],html:'<p class="bt">Pehla jawab 15 aaya tha, kyunki Sunday wala input chhoot gaya. Tumne khud kaha tha: "ideally you should have taught me what is an input in neuron right?? it\'s a mistake on your end."</p><div class="diff"><div class="m">- sirf sale × uska weight</div><div class="p">+ har input × uska apna weight, phir sabko jodo</div></div>'},
  {tag:'Khud karo',cls:'khud',hl:['l1','l2','sum'],type:'num',ans:18,html:'<p class="bt">Aaj 8 packet bika aur kal Sunday hai. Sale ka weight 1.5 hai aur Sunday ka 6. Weighted sum kitna hoga?</p>',why:'8 × 1.5 + 1 × 6 = 12 + 6 = 18.'}
 ]},
/* ---------- BIAS ---------- */
{id:'bias',name:'Bias',title:'Bias: base stock, jo hamesha judta hai',
 pic:'<div class="row" data-k="l1"><span class="c cin">sale <b id="bsv">0</b></span><span class="op">×</span><span class="c ckn">1.5</span><span class="op">=</span><span class="c cbx mono" id="b1">0</span></div>'+
     '<div class="row" data-k="l2"><span class="c cin">Sunday <b id="buv">0</b></span><span class="op">×</span><span class="c ckn">6</span><span class="op">=</span><span class="c cbx mono" id="b2">0</span></div>'+
     '<div class="row" data-k="b"><span class="c cbi" id="bbc">bias +5</span><span class="small dim">kisi input se guna nahi hota</span></div>'+
     '<div class="row" data-k="o"><span class="op">sab jodo →</span><span class="c cou" id="bo">5</span></div>'+
     '<div class="row"><button id="bsb">Sale 0 / 20</button><button id="bub">Sunday on / off</button><button id="bbb">Bias on / off</button></div>',
 st:{s:0,u:0,on:1},
 init:function(){var self=this;function d(){var S=self.st,a=S.s*1.5,c=S.u*6,bb=S.on?5:0;$('bsv').textContent=S.s;$('buv').textContent=S.u;$('b1').textContent=a;$('b2').textContent=c;$('bbc').textContent=S.on?'bias +5':'bias off';$('bo').textContent='kal ka order: '+(a+c+bb);}
   self.draw=d;$('bsb').onclick=function(){self.st.s=self.st.s?0:20;d();};$('bub').onclick=function(){self.st.u=1-self.st.u;d();};$('bbb').onclick=function(){self.st.on=1-self.st.on;d();};d();},
 onBeat:function(b){if(b===0){this.st={s:0,u:0,on:0};}if(b===1){this.st={s:0,u:0,on:1};}if(this.draw)this.draw();},
 beats:[
  {tag:'Dikkat',hl:['l1','l2','o'],html:'<p class="bt">Socho aaj ek bhi packet nahi bika aur kal Sunday bhi nahi. Bina bias ke neuron bolega 0 × 1.5 + 0 × 6 = 0. Matlab kal shelf bilkul khaali. Koi manager aisa nahi karta.</p>'},
  {tag:'Dukaan · base stock',hl:['b','o'],html:'<p class="bt">Manager hamesha kuch base stock rakhta hai: "chahe kuch bhi ho, 5 packet toh rahenge". Yeh 5 kisi input se guna nahi hota. Sab inputs × weights jodne ke baad yeh seedha upar se judta hai.</p>'},
  {tag:'Yeh bhi seekha jaata hai',hl:['b'],html:'<p class="bt">Yeh 5 bhi kisi insaan ne nahi likha. Training mein bias bhi weight ki tarah ghum ghum ke set hota hai. Teeno buttons daba ke khelo.</p>'},
  {tag:'Asli naam',hl:['b'],html:'<p class="bt"><span class="term">bias</span>: neuron ka ek extra seekha hua number, jo weighted sum mein seedha joda jaata hai, kisi input se guna kiye bina.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['l1','l2','b','o'],html:'<p class="tline">'+LINES[5]+'</p>'},
  {tag:'Khud karo',cls:'khud',hl:['l1','l2','b','o'],type:'num',ans:20,html:'<p class="bt">Aaj 10 bika aur kal Sunday nahi hai. Sale ka weight 1.5 hai, Sunday ka 6, aur bias 5. Kal ka order kitna hoga? (Yeh sawaal pichhli baar khula reh gaya tha.)</p>',why:'10 × 1.5 + 0 × 6 + 5 = 15 + 0 + 5 = 20 packet.'}
 ]},
/* ---------- ACTIVATION ---------- */
{id:'activation',name:'Activation',title:'Activation function: total pe aakhri chhota rule',
 pic:'<div class="row"><span class="c cbx" data-k="tot">weighted sum + bias = <b id="atv">12</b></span><span class="op">→</span><span class="c ckn" data-k="gate">ReLU</span><span class="op">→</span><span class="c cou" data-k="out">output <b id="ato">12</b></span></div>'+
     '<input type="range" id="at" min="-20" max="30" step="1" value="12" aria-label="Total">'+
     '<svg class="d" viewBox="0 0 340 130" data-k="graph" role="img" aria-label="ReLU graph"><line class="grid" x1="10" y1="105" x2="330" y2="105"/><line class="grid" x1="138" y1="8" x2="138" y2="118"/><polyline class="pl" points="10,105 138,105 330,15"/><circle class="pt" id="apt" r="6" cx="214" cy="69"/><text class="sm" x="12" y="124">minus total → 0</text><text class="sm" x="230" y="124">plus total → wahi</text></svg>',
 init:function(){function d(){var v=+$('at').value,o=Math.max(0,v);$('atv').textContent=v;$('ato').textContent=o;$('apt').setAttribute('cx',(10+(v+20)/50*320).toFixed(1));$('apt').setAttribute('cy',(105-o/30*90).toFixed(1));}
   $('at').addEventListener('input',d);d();},
 beats:[
  {tag:'Plus total',hl:['tot','gate','out'],set:{at:12},html:'<p class="bt">Neuron ka total (weighted sum + bias) 12 aaya. Ek aakhri chhota rule lagta hai: plus ho toh wahi number aage bhej do. Toh output = 12.</p>'},
  {tag:'Dukaan · Holi wala din',hl:['tot','gate','out'],set:{at:-4},html:'<p class="bt">Kal Holi hai, aadhe log shehar se bahar hain, aur formula bolta hai "−4 packet". Par manager minus 4 packet order nahi kar sakta. Woh seedha 0 order karta hai. Slider ko minus mein le jaake dekho.</p>'},
  {tag:'Asli naam',hl:['gate','graph'],html:'<p class="bt"><span class="term">activation function</span>: neuron ke total pe lagne wala chhota rule, jo final output decide karta hai.<br><span class="term">ReLU</span>: sabse common activation function. Minus ho toh 0, plus ho toh wahi number. LLMs mein iske smooth cousins chalte hain, jaise GELU aur SwiGLU, par idea yahi hai.</p>'},
  {tag:'Yeh hai kyun (poora axis b mein)',hl:['graph'],html:'<p class="bt">Iske bina kitni bhi layers laga do, poora network ek seedha guna-jod ban jaata hai, aur mode-wale patterns nahi seekh paata. Jaise thodi baarish mein order badhta hai, par bahut tez baarish mein delivery band hoti hai aur order girta hai. Activation hi aisa mod bana paata hai.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['tot','gate','out'],html:'<p class="tline">'+LINES[6]+'</p>'},
  {tag:'Khud karo',cls:'khud',hl:['gate'],type:'num',ans:0,html:'<p class="bt">Ek neuron ka total −7 aaya. ReLU ke baad output kya hoga?</p>',why:'0. Minus ho toh ReLU 0 deta hai.'}
 ]},
/* ---------- POORA NEURON ---------- */
{id:'fullneuron',name:'Poora neuron',title:'Poora neuron, ek saath: guna → jodo → bias → activation',
 pic:'<p class="small dim" style="text-align:center" id="fex">Example: aaj 10 bika, kal Sunday</p>'+
     '<div class="row"><span class="c ckn mono" data-k="g" id="fg">10×1.5 = 15 · 1×6 = 6</span></div>'+
     '<div class="row"><span class="op">→</span><span class="c cbx mono" data-k="j" id="fj">jodo: 21</span><span class="op">→</span><span class="c cbi mono" data-k="b" id="fb">+5 = 26</span><span class="op">→</span><span class="c cou mono" data-k="a" id="fa">ReLU → 26</span></div>'+
     '<p class="mono small" style="text-align:center" data-k="f">output = activation( input1×weight1 + input2×weight2 + … + bias )</p>',
 onBeat:function(b){var holi=(b===4);$('fex').textContent=holi?'Example: aaj 2 bika, kal Holi (input 1, weight −12), bias 5':'Example: aaj 10 bika, kal Sunday, bias 5';
   $('fg').textContent=holi?'2×1.5 = 3 · 1×(−12) = −12':'10×1.5 = 15 · 1×6 = 6';$('fj').textContent=holi?'jodo: −9':'jodo: 21';$('fb').textContent=holi?'+5 = −4':'+5 = 26';$('fa').textContent=holi?'ReLU → 0':'ReLU → 26';},
 beats:[
  {tag:'Guna',hl:['g'],html:'<p class="bt">Pehla kadam: har input ko uske weight se guna karo. 10 × 1.5 = 15, aur 1 × 6 = 6.</p>'},
  {tag:'Jodo',hl:['j'],html:'<p class="bt">Doosra kadam: sab jodo. 15 + 6 = 21. Yahi weighted sum hai.</p>'},
  {tag:'Bias',hl:['b'],html:'<p class="bt">Teesra kadam: bias jodo. 21 + 5 = 26.</p>'},
  {tag:'Activation',hl:['a'],html:'<p class="bt">Chautha kadam: activation. ReLU(26) = 26, kyunki number plus hai toh wahi aage jaata hai. Output 26 packet.</p>'},
  {tag:'Holi wala din',hl:['g','j','b','a'],html:'<p class="bt">Ab ek aisa din jahan weight minus hai. 2 × 1.5 = 3, aur 1 × (−12) = −12. Jodne pe −9 aata hai, bias ke baad −4, aur ReLU ke baad 0. Minus packet order nahi hota.</p>'},
  {tag:'⭐ Ek line mein',cls:'tech',hl:['f'],html:'<p class="bt">Har neuron yahi chaar kadam karta hai, chahe dark store ho ya Claude. Neeche wali line yaad rakhne ke liye nahi, samajhne ke liye hai.</p>'},
  {tag:'Khud karo',cls:'khud',hl:['g','j','b','a'],type:'num',ans:0,html:'<p class="bt">Aaj 4 bika aur kal Holi hai (weight −12). Sale ka weight 1.5 hai aur bias 5. ReLU ke baad output kya hoga?</p>',why:'4 × 1.5 = 6 · 1 × (−12) = −12 · jodo = −6 · bias ke baad −1 · ReLU(−1) = 0.'}
 ]},
/* ---------- LAYERS ---------- */
{id:'layers',name:'Layers',title:'Layer: neurons ki line, jiska output agli line ka input',
 pic:'<svg class="d" viewBox="0 0 680 300" role="img" aria-label="Do layer ka network">'+
     '<line class="e" x1="170" y1="80" x2="290" y2="80"/><line class="e" x1="170" y1="80" x2="290" y2="220"/><line class="e" x1="170" y1="220" x2="290" y2="80"/><line class="e" x1="170" y1="220" x2="290" y2="220"/><line class="e" x1="430" y1="80" x2="510" y2="150"/><line class="e" x1="430" y1="220" x2="510" y2="150"/>'+
     '<g class="g" data-k="in"><rect class="bx" x="30" y="56" width="140" height="48" rx="8"/><text x="100" y="85" text-anchor="middle">Sale: 10</text><rect class="bx" x="30" y="196" width="140" height="48" rx="8"/><text x="100" y="225" text-anchor="middle">Sunday: 1</text></g>'+
     '<g class="g" data-k="A"><rect class="mg" x="290" y="48" width="140" height="64" rx="8"/><text x="360" y="74" text-anchor="middle">Manager A = 14</text><text class="sm" x="360" y="96" text-anchor="middle">sale×1 + Sun×4</text></g>'+
     '<g class="g" data-k="B"><rect class="mg" x="290" y="188" width="140" height="64" rx="8"/><text x="360" y="214" text-anchor="middle">Manager B = 5</text><text class="sm" x="360" y="236" text-anchor="middle">sale×0.5 + Sun×0</text></g>'+
     '<g class="g" data-k="H"><rect class="hd" x="510" y="118" width="150" height="64" rx="8"/><text x="585" y="144" text-anchor="middle">Head = 24</text><text class="sm" x="585" y="166" text-anchor="middle">A×1 + B×2</text></g>'+
     '<text class="sm" x="100" y="288" text-anchor="middle">input layer</text><text class="sm" x="360" y="288" text-anchor="middle">hidden layer</text><text class="sm" x="585" y="288" text-anchor="middle">output layer</text></svg>',
 beats:[
  {tag:'Dukaan · inputs',hl:['in'],html:'<p class="bt">Bada dark store ek manager se nahi chalta. Shuru mein do inputs hain: sale 10, aur kal Sunday = 1.</p>'},
  {tag:'Manager A',hl:['in','A'],html:'<p class="bt">Pehli line mein Manager A apne knobs se dekhta hai: 10 × 1 + 1 × 4 = 14. Woh shayad "Sunday ka expert" ban gaya hai.</p>'},
  {tag:'Manager B',hl:['in','B'],html:'<p class="bt">Usi line mein Manager B, same inputs, par alag knobs: 10 × 0.5 + 1 × 0 = 5. Woh "roz ki sale" pe dhyaan deta hai.</p>'},
  {tag:'Head manager',hl:['A','B','H'],html:'<p class="bt">Head manager khud sale nahi dekhta. Woh sirf A aur B ke numbers sunta hai: 14 × 1 + 5 × 2 = 24. A aur B ka output, head ka input ban gaya.</p>'},
  {tag:'Asli naam',hl:['in','A','B','H'],html:'<p class="bt"><span class="term">layer</span>: neurons ki ek line. <span class="term">input layer</span> = shuru ke inputs, <span class="term">hidden layer</span> = beech wali (A aur B), jinka output bahar dikhta nahi, aur <span class="term">output layer</span> = aakhri, jo final prediction deti hai.<br><span class="term">deep learning</span>: jab hidden layers bahut saari hon.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['in','A','B','H'],html:'<p class="tline">'+LINES[7]+'</p>'},
  {tag:'Khud karo',cls:'khud',hl:['A','B','H'],type:'num',ans:20,html:'<p class="bt">Aaj bhi 10 bika, par kal Sunday NAHI hai (0). Knobs wahi hain. Head manager ka final number kya hoga?</p>',why:'A = 10×1 + 0×4 = 10 · B = 10×0.5 + 0 = 5 · Head = 10×1 + 5×2 = 20.'}
 ]},
/* ---------- TRAINING ---------- */
{id:'training',name:'Training',title:'Training: predict karo, galti napo, knob ghumao, dobara',
 pic:'<p class="small dim" style="text-align:center">Har din sale 20, asal mein hamesha 30 lagta hai. Sahi weight 1.5 hai, par machine ko pata nahi. Learning rate 0.001.</p>'+
     '<div class="stats"><div class="st" data-k="day"><div class="k">Din</div><div class="v" id="td">Shuru</div></div><div class="st" data-k="w"><div class="k">Weight (knob)</div><div class="v" id="tw" style="color:var(--kn)">1.0</div></div>'+
     '<div class="st" data-k="p"><div class="k">Prediction → asli</div><div class="v" id="tp">— → 30</div></div><div class="st" data-k="e"><div class="k">Galti · loss</div><div class="v" id="te" style="color:var(--er)">—</div></div></div>'+
     '<div data-k="e2"><div class="bar"><div id="tbar" style="width:0%"></div></div><p class="small dim" id="tu" style="text-align:center;margin-top:4px"></p></div>',
 onBeat:function(b){var D=[['Shuru','1.0','— → 30','—',0,'Initialization: weight ek random andaaze pe.'],['Din 1','1.0 → 1.2','20 → 30','+10 · 100',100,'badlaav = 0.001 × 10 × 20 = 0.2'],['Din 2','1.2 → 1.32','24 → 30','+6 · 36',60,'badlaav = 0.001 × 6 × 20 = 0.12'],['Din 3','1.32 → 1.39','26.4 → 30','+3.6 · 13',36,'badlaav = 0.001 × 3.6 × 20 = 0.072'],['Din 4','1.39 → 1.44','27.8 → 30','+2.2 · 4.7',22,'har din galti pichhle din ki lagbhag 60%'],['Bahut din baad','≈ 1.5','30 → 30','≈ 0 · ≈ 0',1,'knob 1.5 pe ruk gaya']];
   var r=D[Math.min(b,5)];$('td').textContent=r[0];$('tw').textContent=r[1];$('tp').textContent=r[2];$('te').textContent=r[3];$('tbar').style.width=r[4]+'%';$('tu').textContent=r[5];},
 beats:[
  {tag:'Initialization',hl:['day','w'],html:'<p class="bt">Pehle din machine ko kuch nahi pata, isliye knob ek random andaaze pe hota hai: 1.0. Yeh kisi data se nahi aaya.</p>'},
  {tag:'Din 1',hl:['p','e','e2','w'],html:'<p class="bt">Machine predict karti hai: 20 × 1.0 = 20. Asal mein 30 laga. Galti = asli − prediction = +10, yaani kam bola. Isliye knob upar ghumega: badlaav = learning rate × galti × input = 0.001 × 10 × 20 = 0.2. Naya weight 1.2.</p>'},
  {tag:'Din 2',hl:['p','e','e2','w'],html:'<p class="bt">20 × 1.2 = 24. Galti +6, toh ghumana bhi chhota hai: 0.12. Weight 1.32. Galti ghat rahi hai.</p>'},
  {tag:'Din 3',hl:['p','e','e2','w'],html:'<p class="bt">20 × 1.32 = 26.4. Galti +3.6. Chhoti galti, chhota ghumana. Weight 1.39.</p>'},
  {tag:'Din 4',hl:['p','e','e2','w'],html:'<p class="bt">Galti lagbhag +2.2. Har din galti pichhle din ki lagbhag 60% reh jaati hai, aur knob 1.5 ki taraf sarakta jaata hai.</p>'},
  {tag:'Bahut din baad',hl:['w','e'],html:'<p class="bt">Knob 1.5 pe ruk jaata hai, jahan galti lagbhag zero hai. Kisi insaan ne 1.5 nahi likha; galtiyon ne knob ko wahan dhakela. Bias bhi isi tarah ghumta hai.</p>'},
  {tag:'Asli naam · galti aur loss',hl:['e','e2'],html:'<p class="bt"><span class="term">error</span>: galti = asli jawab − prediction. Plus matlab kam bola, minus matlab zyada bola.<br><span class="term">loss</span>: galti kitni badi thi, ek positive number mein. Yahan galti × galti (squared error). Training ka poora goal hai loss ko chhota karna.</p>'},
  {tag:'Loss square kyun',hl:['e'],html:'<p class="bt">Galti +10 ho ya −10, dono utni hi buri hain, aur square dono ko 100 bana deta hai. Saath mein badi galti ko zyada saza milti hai: galti 2 ka loss 4, par galti 10 ka loss 100.</p>'},
  {tag:'Asli naam · baaki',hl:['day','w','p','e'],html:'<p class="bt"><span class="term">training</span>: examples pe baar baar predict, loss napo, weights aur biases ghumao.<br><span class="term">initialization</span>: shuru ka random andaaza.<br><span class="term">training data</span>: jin examples pe seekhte hain.<br><span class="term">gradient descent</span>: "loss kam karne ki direction mein thoda thoda ghumao" wala tareeka. Andar ka hisaab axis c mein.</p>'},
  {tag:'⭐ Technical line',cls:'tech',hl:['day','w','p','e'],html:'<p class="tline">'+LINES[8]+'</p>'},

 init:function(){var seed=7,wd=0.4,wr=-1,bb=0,n=0,last=null,lr=0.01;function rnd(){seed=(seed*16807)%2147483647;return (seed-1)/2147483646;}
   function one(){var km=1+Math.floor(rnd()*8),rain=rnd()<0.3?1:0,act=10+3*km+8*rain+(rnd()*4-2),pr=wd*km+wr*rain+bb,er=act-pr;wd+=lr*er*km;wr+=lr*er*rain;bb+=lr*er;n++;last={km:km,rain:rain,act:act,pr:pr,er:er};}
   function d(){$('sn').textContent=n.toLocaleString('en-IN');$('swd').textContent=wd.toFixed(2);$('swr').textContent=wr.toFixed(2);$('sb').textContent=bb.toFixed(2);
     $('sl').textContent=last?(last.km+' km, baarish '+(last.rain?'haan':'nahi')+' · bola '+last.pr.toFixed(1)+' min · asli '+last.act.toFixed(1)+' · galti '+last.er.toFixed(1)):'Knobs abhi random hain.';}
   function run(k){for(var j=0;j<k;j++)one();d();}

/* ---------- ENGINE ---------- */
var cur=0,beat=0,rendered=-1,seen={};
try{seen=JSON.parse(localStorage.getItem('nnA_seen')||'{}')||{};}catch(e){seen={};}
function saveSeen(){try{localStorage.setItem('nnA_seen',JSON.stringify(seen));}catch(e){}}
function railDraw(){$('rail').innerHTML=I.map(function(x,k){return '<button class="rc'+(k===cur?' now':(seen[x.id]?' seen':''))+'" data-i="'+k+'">'+x.name+'</button>';}).join('');
  Array.prototype.forEach.call($('rail').querySelectorAll('.rc'),function(b){b.onclick=function(){go(+b.getAttribute('data-i'),0);};});
  var now=$('rail').querySelector('.now');if(now&&now.scrollIntoView){try{now.scrollIntoView({block:'nearest',inline:'center'});}catch(e){}}}
function setInputs(map){if(!map)return;Object.keys(map).forEach(function(id){var el=$(id);if(el){el.value=map[id];el.dispatchEvent(new Event('input'));}});}
function nextName(){var x=I[cur];if(beat<x.beats.length-1)return x.name+' › '+x.beats[beat+1].tag;if(cur<I.length-1)return I[cur+1].name;return 'axis b (kyun / first principles)';}
function render(){var x=I[cur],b=x.beats[beat];
  if(rendered!==cur){$('pz').innerHTML=x.pic;$('ttl').textContent=x.title;if(x.init)x.init();rendered=cur;}
  if(x.onBeat)x.onBeat(beat);setInputs(b.set);
  var keys=b.hl||[];Array.prototype.forEach.call($('pz').querySelectorAll('[data-k]'),function(el){var k=el.getAttribute('data-k');var on=keys.indexOf(k)>=0;
    el.classList.toggle('hl',on&&el.tagName!=='g');el.classList.toggle('dimmed',keys.length>0&&!on);if(el.tagName==='g'){el.classList.toggle('hlg',on);}});
  var h='<span class="tag'+(b.cls?' '+b.cls:'')+'">'+b.tag+'</span>'+b.html;
  if(b.type==='num'){h+='<div class="khud"><input id="ka" type="text" inputmode="decimal" aria-label="Tumhara jawab" placeholder="jawab"><button id="kc">Check</button></div><p class="fb" id="kf"></p><div class="why" id="kw" hidden>'+b.why+'</div>';}
  if(b.type==='reveal'){h+='<div class="khud"><button id="kr">Socha? Jawab dikhao</button></div><div class="why" id="kw" hidden>'+b.why+'</div>';}
  $('bz').innerHTML=h;
  if(b.type==='num'){var tries=0;var chk=function(){var v=$('ka').value.trim().replace(',','.');if(v===''){$('kf').className='fb bad';$('kf').textContent='Pehle number likho.';return;}
      var n=parseFloat(v);if(isNaN(n)){$('kf').className='fb bad';$('kf').textContent='Sirf number likho, jaise 21.';return;}
      if(Math.abs(n-b.ans)<1e-6){$('kf').className='fb good';$('kf').textContent='✅ Sahi.';$('kw').hidden=false;}
      else{tries++;$('kf').className='fb bad';$('kf').textContent=tries<2?'❌ Abhi nahi. Picture dekho aur ek baar phir try karo.':'❌ Abhi nahi. Neeche poora hisaab hai, usse milao.';if(tries>=2)$('kw').hidden=false;}};
    $('kc').onclick=chk;$('ka').addEventListener('keydown',function(e){if(e.key==='Enter')chk();});$('ka').addEventListener('input',function(){$('kf').textContent='';});}
  if(b.type==='reveal'){$('kr').onclick=function(){$('kw').hidden=false;};}
  $('pos').textContent='Tum yahan ho: axis a › '+x.name+' › '+b.tag;$('next').textContent='Iske baad: '+nextName();
  seen[x.id]=true;saveSeen();railDraw();
  if(location.hash!=='#'+x.id){try{history.replaceState(null,'','#'+x.id);}catch(e){}}
  $('prev').disabled=(cur===0&&beat===0);}
function go(i,b){cur=Math.max(0,Math.min(I.length-1,i));beat=Math.max(0,Math.min(I[cur].beats.length-1,b));render();}
function fwd(){if(beat<I[cur].beats.length-1)go(cur,beat+1);else if(cur<I.length-1)go(cur+1,0);}
function back(){if(beat>0)go(cur,beat-1);else if(cur>0)go(cur-1,I[cur-1].beats.length-1);}
$('nextb').onclick=fwd;$('prev').onclick=back;$('ishuru').onclick=function(){go(cur,0);};
document.addEventListener('keydown',function(e){var t=e.target&&e.target.tagName;if(t==='INPUT'||t==='TEXTAREA')return;if(e.key==='ArrowRight'){fwd();e.preventDefault();}if(e.key==='ArrowLeft'){back();e.preventDefault();}});
function fromHash(){var h=(location.hash||'').replace('#','');for(var k=0;k<I.length;k++){if(I[k].id===h)return k;}return 0;}
window.addEventListener('hashchange',function(){var k=fromHash();if(k!==cur)go(k,0);});
go(fromHash(),0);
})();
